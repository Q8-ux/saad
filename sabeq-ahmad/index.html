<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#073f47">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src 'self'; connect-src https://sabeq-legal-public.centrino.chatgpt.site; base-uri 'self'; form-action 'none'; object-src 'none'">
<title>سابق القانونية | لوحة أحمد</title>
<style>
@font-face{font-family:Cairo;src:url('../sabeq-admin-preview/fonts/Cairo.ttf') format('truetype');font-weight:200 1000;font-display:swap}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:#f3f7f8;color:#14343f}
#gate{min-height:100%;max-width:700px;margin:auto;padding:48px 20px;display:flex;flex-direction:column;justify-content:center;gap:15px}
h1{font-size:28px;margin:0}
p{line-height:1.8}
a{color:#08747a}
.info{padding:18px;border:1px solid #c9e0e3;background:white;border-radius:14px}
#dashboard{width:100%;height:100dvh;border:0;display:none;background:white}
small{color:#55727c}
</style>
</head>
<body>
<main id="gate" aria-live="polite">
<img src="../sabeq-admin-preview/sabeq-logo.png" width="64" height="64" alt="مجموعة سابق القانونية">
<h1>لوحة متابعة أحمد</h1>
<p id="state">جارٍ التحقق من جلسة المشرف...</p>
<div id="details" class="info" hidden>لم يتم تأكيد جلسة أحمد. لا يمكن إظهار بيانات المذكرات أو رسائل العملاء من رابط عام دون مصادقة.</div>
<small>تُعرض البيانات الفعلية فقط إذا كان الحساب الموثّق باسم ahmad وصلاحيته مشرف تشغيل. لا تُمنح صلاحيات المدير من هذا الرابط.</small>
</main>
<iframe id="dashboard" title="لوحة أحمد الحقيقية — متابعة المذكرات" referrerpolicy="no-referrer" loading="eager"></iframe>
<script>
(async()=>{
  'use strict';
  const message=document.getElementById('state');
  const detail=document.getElementById('details');
  const frame=document.getElementById('dashboard');
  const storageKey='sabeq-management-session';
  let token='';
  try{token=sessionStorage.getItem(storageKey)||'';}catch{}
  if(!token){message.textContent='لا توجد جلسة مشرف موثّقة في هذا المتصفح.';detail.hidden=false;return;}
  try{
    const response=await fetch('https://sabeq-legal-public.centrino.chatgpt.site/api/management/session',{
      headers:{'Authorization':'Bearer '+token},credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(20000)
    });
    if(!response.ok){message.textContent='انتهت جلسة المشرف أو تعذر التحقق منها.';detail.hidden=false;return;}
    const data=await response.json();
    const manager=data.manager||{};
    if(manager.role!=='operator'||String(manager.username||'').toLowerCase()!=='ahmad'){
      message.textContent='هذه الجلسة ليست لحساب أحمد المشرف.';
      detail.hidden=false;
      return;
    }
    frame.src='../sabeq-admin-preview/#memos';
    frame.addEventListener('load',()=>{document.getElementById('gate').hidden=true;frame.style.display='block';},{once:true});
  }catch{
    message.textContent='تعذر الاتصال بخادم التحقق من جلسة أحمد.';
    detail.hidden=false;
  }
})();
</script>
</body>
</html>
