<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="سابق المطوّر — منصة إدارة المكتب القانوني ومحرك البحث في القوانين">
  <title>سابق المطوّر | منصة إدارة المكتب القانوني</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07111f;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
    iframe{display:block;width:100%;height:100dvh;border:0;background:#f8fafc}
    .loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#07111f,#102942);color:#fff;text-align:center;transition:opacity .25s ease,visibility .25s ease}
    .loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .card{width:min(92vw,430px);padding:30px 24px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.07);box-shadow:0 24px 70px rgba(0,0,0,.28);backdrop-filter:blur(12px)}
    .mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:#2a78d6;font-size:30px;font-weight:800;box-shadow:0 12px 34px rgba(42,120,214,.38)}
    h1{margin:0 0 9px;font-size:clamp(24px,7vw,32px)}
    p{margin:0;color:#cbd5e1;font-size:16px;line-height:1.8}
    .spinner{width:34px;height:34px;margin:22px auto 0;border:3px solid rgba(255,255,255,.2);border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite}
    .direct{position:fixed;z-index:8;inset-inline-end:12px;bottom:max(12px,env(safe-area-inset-bottom));display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 13px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(7,17,31,.86);color:#fff;text-decoration:none;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(8px)}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="card">
      <div class="mark">س</div>
      <h1>سابق المطوّر</h1>
      <p>جارٍ تشغيل منصة إدارة المكتب القانوني ومحرك البحث…</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>
  <iframe
    id="sabeqApp"
    title="سابق المطوّر"
    src="https://sabeq-legal-pro.centrino.chatgpt.site/"
    allow="clipboard-write; microphone"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <a class="direct" href="https://sabeq-legal-pro.centrino.chatgpt.site/" target="_blank" rel="noopener">فتح مباشر</a>
  <script>
    const appFrame = document.getElementById("sabeqApp");
    const loading = document.getElementById("loading");
    appFrame.addEventListener("load", () => {
      window.setTimeout(() => loading.classList.add("hidden"), 450);
    });
    window.setTimeout(() => loading.classList.add("hidden"), 7000);
  </script>
</body>
</html>
