<title>أمواج زرقاء متحركة وشبكة منحنية هادئة</title>
<style>
.wave-back,.wave-front,.wave-line,.mesh{transform-box:view-box;transform-origin:center}
.wave-back{animation:back-swell 22s ease-in-out infinite alternate;animation-delay:-9s}
.wave-front{animation:front-swell 16s ease-in-out infinite alternate;animation-delay:-6s}
.wave-line{animation:front-swell 16s ease-in-out infinite alternate;animation-delay:-6s}
.mesh{animation:mesh-sway 24s ease-in-out infinite alternate;animation-delay:-10s}
@keyframes back-swell{from{transform:translate(-60px,-38px)}to{transform:translate(65px,45px)}}
@keyframes front-swell{from{transform:translate(70px,-42px)}to{transform:translate(-65px,50px)}}
@keyframes mesh-sway{from{transform:translate(-25px,-22px)}to{transform:translate(30px,28px)}}
@media(prefers-reduced-motion:reduce){.wave-back,.wave-front,.wave-line,.mesh{animation:none}}
</style>
