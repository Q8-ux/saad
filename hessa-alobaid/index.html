<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b302c" />
  <meta name="description" content="النظام الداخلي لمكتب المحامية حصة العبيد لإدارة القضايا والعملاء والجلسات والأرشفة والمراسلات والمذكرات القانونية." />
  <title>النظام الداخلي | مكتب المحامية حصة العبيد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260806-sabeq1" />
  <link rel="stylesheet" href="mobile.css?v=20260806-sabeq1" />
  <link rel="stylesheet" href="brand-system.css?v=20260806-sabeq1" />
  <link rel="stylesheet" href="dashboard-system.css?v=20260806-sabeq1" />
  <link rel="stylesheet" href="legal-assistant-bot.css?v=20260806-sabeq1" />
  <link rel="stylesheet" href="home-controls.css?v=20260806-sabeq1" />
  <link rel="stylesheet" href="office-tools.css?v=20260806-sabeq1" />
  <link rel="stylesheet" href="sabeq-internal.css?v=20260806-sabeq1" />
</head>
<body>
  <section class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="legal-logo legal-logo-lg" aria-hidden="true"><span>ح ع</span><small>⚖</small></div>
      <p class="eyebrow" data-i18n="internalSystem">النظام الداخلي</p>
      <h1 data-i18n="loginTitle">إدارة مكتب المحامية حصة العبيد</h1>
      <p class="muted" data-i18n="loginSubtitle">منصة موحدة لإدارة القضايا والعملاء والجلسات والمستندات والمراسلات والشؤون المالية.</p>
      <form id="loginForm" class="login-form">
        <label><span data-i18n="username">اسم المستخدم</span><input id="loginUser" required autocomplete="username" value="admin" /></label>
        <label><span data-i18n="password">كلمة المرور</span><input id="loginPassword" required type="password" autocomplete="current-password" value="admin123" /></label>
        <button class="btn btn-primary full" type="submit" data-i18n="login">تسجيل الدخول</button>
        <small data-i18n="demoCredentials">الدخول التجريبي: admin / admin123</small>
      </form>
    </div>
  </section>

  <div class="app-shell hidden" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="legal-logo" aria-hidden="true"><span>ح ع</span><small>⚖</small></div>
        <div class="brand-copy"><strong data-i18n="officeName">مكتب المحامية حصة العبيد</strong><small data-i18n="lawManagementSystem">النظام الداخلي لإدارة المكتب</small></div>
        <button class="icon-btn close-sidebar" id="closeSidebar" type="button" aria-label="إغلاق القائمة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <p class="nav-label">الرئيسية</p>
        <button class="nav-item active" data-view="dashboard"><span>⌂</span><b>لوحة التحكم</b></button>
      </nav>

      <div class="sidebar-foot">
        <div class="user-chip"><span class="avatar">ح</span><div><strong id="sidebarUsername">مدير النظام</strong><small data-i18n="administrator">مدير النظام</small></div></div>
        <button class="logout-btn" id="logoutBtn" type="button" data-i18n="logout">تسجيل الخروج</button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

    <main class="workspace">
      <header class="topbar">
        <div class="topbar-title">
          <button class="icon-btn mobile-menu" id="openSidebar" type="button" aria-label="فتح القائمة" aria-controls="sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
          </button>
          <button class="icon-btn home-button" id="homeButton" type="button" aria-label="الرجوع إلى الرئيسية" title="الرجوع إلى الرئيسية">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.5 10.3V20h13v-9.7"/><path d="M9.5 20v-5.5h5V20"/></svg>
          </button>
          <div><p id="breadcrumb" class="breadcrumb">لوحة التحكم</p><h2 id="pageTitle">الرئيسية</h2></div>
        </div>
        <div class="topbar-actions">
          <label class="search-box"><span>⌕</span><input id="globalSearch" data-i18n-placeholder="searchSystem" placeholder="بحث في النظام" /></label>
          <button class="icon-btn" id="langToggle" type="button" aria-label="اللغة">EN</button>
          <button class="icon-btn" id="themeToggle" type="button" aria-label="المظهر">☾</button>
          <button class="icon-btn notification-btn" id="notificationsBtn" type="button" aria-label="الإشعارات">⌁<em id="notificationCount">3</em></button>
        </div>
      </header>

      <div class="content" id="appContent"></div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header><div><p class="eyebrow" id="modalKicker"></p><h3 id="modalTitle"></h3></div><button class="icon-btn" id="closeModal" type="button">×</button></header>
      <div id="modalBody"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="navigation.js?v=20260806-sabeq2"></script>
  <script src="app.js?v=20260806-sabeq1"></script>
  <script src="dashboard-system.js?v=20260806-sabeq1"></script>
  <script src="legal-assistant-bot.js?v=20260806-sabeq1"></script>
  <script src="home-controls.js?v=20260806-sabeq1"></script>
  <script src="office-tools.js?v=20260806-sabeq1"></script>
  <script src="sabeq-internal.js?v=20260806-sabeq1"></script>
</body>
</html>
