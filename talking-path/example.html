<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسار التحدث</title><style>body{font-family:Arial;background:#07191f;color:white;display:grid;place-items:center;min-height:100vh}.box{text-align:center}button{width:140px;height:140px;border-radius:50%;font-size:40px}#s{margin:20px}</style><div class="box"><h1>مسار التحدث</h1><button id="m">🎙️</button><div id="s">جاهز</div><div id="t"></div></div><script src="./talking-path.js"></script><script>const s=document.querySelector("#s"),t=document.querySelector("#t");const talk=TalkingPath.create({language:"ar-KW",onState:x=>s.textContent=x.state,onText:async text=>{t.textContent=text;return "تم استلام كلامك. اربط هنا وكيل مشروعك للحصول على الرد الحقيقي."}});document.querySelector("#m").onclick=()=>talk.start();</script></html>
