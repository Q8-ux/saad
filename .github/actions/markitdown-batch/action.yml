name: Shared MarkItDown batch converter
description: Convert repository documents to Markdown with Microsoft MarkItDown.

inputs:
  source-dir:
    description: Source directory relative to the repository root.
    required: false
    default: "."
  output-dir:
    description: Output directory relative to the repository root.
    required: false
    default: ".markitdown-output"
  mode:
    description: Use documents for smart discovery or all-supported for every supported file.
    required: false
    default: "documents"
  max-file-size-mb:
    description: Maximum size of each input file.
    required: false
    default: "50"
  max-files:
    description: Maximum files converted in one run.
    required: false
    default: "250"
  max-output-characters:
    description: Maximum Markdown characters produced by each file.
    required: false
    default: "5000000"
  timeout-seconds:
    description: Maximum conversion time for each file.
    required: false
    default: "180"
  fail-on-error:
    description: Fail the job when any eligible document cannot be converted.
    required: false
    default: "true"

outputs:
  converted-count:
    description: Number of successfully converted documents.
    value: ${{ steps.convert.outputs.converted_count }}
  manifest:
    description: Relative path to the conversion manifest.
    value: ${{ steps.convert.outputs.manifest }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Microsoft MarkItDown
      shell: bash
      run: python -m pip install --disable-pip-version-check -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Convert documents
      id: convert
      shell: bash
      env:
        MARKITDOWN_SOURCE_DIR: ${{ inputs.source-dir }}
        MARKITDOWN_OUTPUT_DIR: ${{ inputs.output-dir }}
        MARKITDOWN_MODE: ${{ inputs.mode }}
        MARKITDOWN_MAX_FILE_SIZE_MB: ${{ inputs.max-file-size-mb }}
        MARKITDOWN_MAX_FILES: ${{ inputs.max-files }}
        MARKITDOWN_MAX_OUTPUT_CHARACTERS: ${{ inputs.max-output-characters }}
        MARKITDOWN_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        MARKITDOWN_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: >-
        python "$GITHUB_ACTION_PATH/convert.py"
        --source-dir "$MARKITDOWN_SOURCE_DIR"
        --output-dir "$MARKITDOWN_OUTPUT_DIR"
        --mode "$MARKITDOWN_MODE"
        --max-file-size-mb "$MARKITDOWN_MAX_FILE_SIZE_MB"
        --max-files "$MARKITDOWN_MAX_FILES"
        --max-output-characters "$MARKITDOWN_MAX_OUTPUT_CHARACTERS"
        --timeout-seconds "$MARKITDOWN_TIMEOUT_SECONDS"
        --fail-on-error "$MARKITDOWN_FAIL_ON_ERROR"
