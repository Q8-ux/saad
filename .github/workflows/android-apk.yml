name: Build AI Chess Android APK

on:
  push:
    branches: [fix/ai-chess-render-history]
    paths:
      - "android-chess/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-chess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
      - name: Build debug APK
        run: ./gradle-8.7/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Chess-Kuwait-debug-APK
          path: android-chess/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
