name: Publish Live Video Downloader
on:
  push:
    branches: [main]
    paths:
      - 'video-downloader/index.html'
      - 'video-downloader/deployment/**'
      - 'video-downloader/tests/frontend.test.cjs'
      - '.github/workflows/publish-video-downloader.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check direct download routing and publication boundaries
        run: |
          node --test video-downloader/tests/frontend.test.cjs
          python -m unittest discover -s video-downloader/deployment -p 'test_*.py' -v
      - uses: actions/configure-pages@v5
      - name: Update downloader and preserve current published sites
        env:
          GH_TOKEN: ${{ github.token }}
        run: python video-downloader/deployment/prepare.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 30
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify the published downloader release
        run: |
          python - <<'PY'
          import os, time, urllib.request
          root = 'https://q8-ux.github.io/saad/video-downloader/'
          expected = os.environ['GITHUB_SHA']
          for attempt in range(8):
              try:
                  version = urllib.request.urlopen(root + 'release-version.txt?v=' + expected, timeout=15).read().decode().strip()
                  page = urllib.request.urlopen(root + '?v=' + expected, timeout=15).read().decode()
                  if version == expected and 'video-downloader-web-20261124' in page:
                      print('Verified Video Downloader release', expected)
                      break
              except Exception as error:
                  print('Verification pending:', type(error).__name__)
              time.sleep(5)
          else:
              raise SystemExit('Published downloader release could not be confirmed')
          PY
