name: Sabeq memo admin bridge contract
on:
  push:
    paths:
      - 'sabeq-legal/research-source/app/api/bridge/memos/**'
      - 'sabeq-legal/research-source/tests/memo-admin-bridge.test.mjs'
      - '.github/workflows/sabeq-memo-admin-bridge.yml'
  pull_request:
    paths:
      - 'sabeq-legal/research-source/app/api/bridge/memos/**'
      - 'sabeq-legal/research-source/tests/memo-admin-bridge.test.mjs'
      - '.github/workflows/sabeq-memo-admin-bridge.yml'
permissions:
  contents: read
jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test sabeq-legal/research-source/tests/memo-admin-bridge.test.mjs
