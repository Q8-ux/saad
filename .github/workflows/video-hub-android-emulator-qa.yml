name: Video Hub Android Emulator Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-hub-android-emulator-qa.yml'
      - 'video-downloader/android/app/src/main/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app
        run: gradle -p video-downloader/android :app:assembleDebug --no-daemon
      - name: Boot Android emulator and inspect real app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 720
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r video-downloader/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.q8ux.videohub.download.beta/com.q8ux.videohub.MainActivity
            sleep 8
            adb shell pidof com.q8ux.videohub.download.beta
            mkdir -p video-downloader/android/test-results
            adb shell uiautomator dump /data/local/tmp/video-hub-ui.xml
            adb pull /data/local/tmp/video-hub-ui.xml video-downloader/android/test-results/screen.xml
            adb exec-out screencap -p > video-downloader/android/test-results/launch.png
            python - <<'PY'
            from pathlib import Path
            import xml.etree.ElementTree as ET
            p=Path('video-downloader/android/test-results/screen.xml')
            root=ET.parse(p).getroot()
            labels=[x.attrib.get('text','') for x in root.iter('node')]
            print('UI_LABELS',list(filter(None,labels))[:25])
            assert any('تحميل MP4' in s for s in labels), 'Direct MP4 download button missing'
            assert any('تحميل MP3' in s for s in labels), 'Direct MP3 download button missing'
            assert not any('كلمة مرور' in s for s in labels), 'Password prompt persists'
            assert any('تحميل الفيديو' in s for s in labels), 'Renamed app title missing'
            print('PASS: real Android app launched and password screen absent')
            PY
            adb logcat -d -s AndroidRuntime:E > video-downloader/android/test-results/crashes.txt
            if grep -E 'FATAL EXCEPTION|Process: com.q8ux.videohub.download.beta' video-downloader/android/test-results/crashes.txt; then
              echo 'Android application crashed' >&2
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-hub-emulator-ui
          path: video-downloader/android/test-results/
          retention-days: 7
