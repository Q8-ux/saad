name: Video Hub Android Emulator Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-hub-android-emulator-qa.yml'
      - 'video-downloader/android/app/src/main/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: macos-15-intel
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app
        run: gradle -p video-downloader/android :app:assembleDebug --no-daemon
      - name: Boot Android emulator and inspect real app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 480
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r video-downloader/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.q8ux.videohub.download.beta/com.q8ux.videohub.MainActivity
            sleep 8
            adb shell pidof com.q8ux.videohub.download.beta
            mkdir -p video-downloader/android/test-results
            adb shell dumpsys activity activities > video-downloader/android/test-results/activities.txt
            adb shell dumpsys window > video-downloader/android/test-results/window.txt
            adb exec-out screencap -p > video-downloader/android/test-results/launch.png
            adb logcat -d -s AndroidRuntime:E > video-downloader/android/test-results/crashes.txt
            python - <<'PY'
            from pathlib import Path
            app='com.q8ux.videohub.download.beta'
            activity=Path('video-downloader/android/test-results/activities.txt').read_text()
            window=Path('video-downloader/android/test-results/window.txt').read_text()
            crashes=Path('video-downloader/android/test-results/crashes.txt').read_text()
            screen=Path('video-downloader/android/test-results/launch.png').read_bytes()
            print('APP_ACTIVITY_REFERENCES',activity.count(app))
            print('APP_WINDOW_REFERENCES',window.count(app))
            print('SCREENSHOT_BYTES',len(screen))
            assert app in activity, 'App absent from Android ActivityManager'
            assert app in window, 'App absent from Android WindowManager'
            assert len(screen)>5000 and screen[:8]==bytes([137,80,78,71,13,10,26,10]), 'No valid emulator screenshot'
            assert 'FATAL EXCEPTION' not in crashes and ('Process: '+app) not in crashes, 'App crashed at launch'
            print('PASS: native Android process is running and Activity window exists without crash')
            PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-hub-emulator-ui
          path: video-downloader/android/test-results/
          retention-days: 7
