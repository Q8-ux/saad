name: Build Ministry Legal Library
# The importer is resumable and is intentionally restarted with the newest safeguards.
# Resume checkpoint build requested on 2026-08-19.

on:
  workflow_dispatch:
  push:
    paths:
      - 'legal-memo-platform/**'
      - '.github/workflows/build-legal-library.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: ministry-legal-library
  cancel-in-progress: true

jobs:
  extract-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: legal-memo-platform
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: legal-memo-platform/package-lock.json

      - name: Install Arabic PDF extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick poppler-utils tesseract-ocr tesseract-ocr-ara

      - name: Install application dependencies
        run: npm ci

      - name: Verify the legal-library implementation
        run: npm test

      - name: Download the verified legal-library checkpoint
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31949686941
          name: ministry-legal-library
          path: legal-memo-platform/checkpoint

      - name: Restore the legal-library checkpoint
        run: |
          mkdir -p generated
          if [ -f seed/legal-library.sqlite.gz ]; then
            gzip -cd seed/legal-library.sqlite.gz > generated/legal-memo.db
          elif [ -f checkpoint/generated/legal-memo.db ]; then
            cp checkpoint/generated/legal-memo.db generated/legal-memo.db
          fi

      - name: Extract and analyse official Ministry PDFs
        env:
          DATA_DIR: ${{ github.workspace }}/legal-memo-platform/generated
          MOJ_OCR_ENABLED: 'true'
          MOJ_OCR_MAX_PAGES: '1200'
          MOJ_REQUEST_DELAY_MS: '350'
          MOJ_REQUEST_TIMEOUT_MS: '45000'
          MOJ_REQUEST_ATTEMPTS: '2'
          MOJ_COMMAND_TIMEOUT_MS: '120000'
          MOJ_MAX_PDF_MB: '250'
          MOJ_CONCURRENCY: '2'
          OMP_THREAD_LIMIT: '1'
        run: npm run ingest:moj

      - name: Compress the indexed legal database
        run: |
          gzip -9 -c generated/legal-memo.db > seed/legal-library.sqlite.gz
          test "$(stat -c%s seed/legal-library.sqlite.gz)" -le 95000000

      - name: Keep an extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ministry-legal-library
          path: |
            legal-memo-platform/generated/legal-memo.db
            legal-memo-platform/generated/legal-memo.db-wal
            legal-memo-platform/seed/legal-library.sqlite.gz
          if-no-files-found: warn
          retention-days: 90

      - name: Commit the refreshed legal-library seed
        if: success()
        working-directory: .
        run: |
          if git diff --quiet -- legal-memo-platform/seed/legal-library.sqlite.gz; then
            echo "No legal-library data change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-memo-platform/seed/legal-library.sqlite.gz
          git commit -m "Refresh Ministry legal library"
          git push
