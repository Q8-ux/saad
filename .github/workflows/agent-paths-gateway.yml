name: Agent paths gateway tests
on:
  pull_request:
    paths:
      - 'agent-paths/**'
      - '.github/workflows/agent-paths-gateway.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: cd agent-paths/service && python -m unittest discover -v
