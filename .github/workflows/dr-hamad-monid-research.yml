name: Dr Hamad - Monid Research and SEO QA
on:
  schedule:
    - cron: '15 04 * * 1'
  pull_request:
    paths:
      - 'dr-hamad/monid/**'
      - '.github/workflows/dr-hamad-monid-research.yml'
      - '.github/scripts/publish-dr-hamad-site.py'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Public research category (no patient data)'
        type: choice
        required: true
        default: seo-kuwait
        options:
          - seo-kuwait
          - knee-education
          - hip-education
          - social-public
      mode:
        description: 'discover lists tools; inspect or run requires provider and endpoint'
        type: choice
        required: true
        default: discover
        options:
          - discover
          - inspect
          - run
      provider:
        description: 'Provider slug returned by discover (inspect/run only)'
        type: string
        required: false
      endpoint:
        description: 'Endpoint path returned by discover (inspect/run only)'
        type: string
        required: false
      paid_run:
        description: 'Explicitly authorize a reviewed, fixed-price, allowlisted call (run only)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: dr-hamad-monid-research
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check dr-hamad/monid/research.mjs
      - run: node --check dr-hamad/monid/run-all.mjs
      - run: node --check dr-hamad/monid/public-audit.mjs
      - run: node --test dr-hamad/monid/run-all.test.mjs
      - run: node dr-hamad/monid/run-all.mjs
      - run: node --test dr-hamad/monid/research.test.mjs
      - run: node dr-hamad/verify.cjs
      - name: Assert private Monid backend excluded from Pages deployment
        run: |
          python -m py_compile .github/scripts/publish-dr-hamad-site.py
          python - <<'PY'
          import runpy
          config = runpy.run_path(".github/scripts/publish-dr-hamad-site.py")
          assert all(not p.startswith("dr-hamad/monid/") for p in config["FILES"]), "Monid private backend selected for public deployment"
          print("Private Monid code excluded from public Pages files")
          PY
  editorial-research:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'discover'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Monid research (unpublished)
        env:
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
          MONID_TOPIC: ${{ inputs.topic }}
          MONID_MODE: ${{ inputs.mode }}
          MONID_PROVIDER: ${{ inputs.provider }}
          MONID_ENDPOINT: ${{ inputs.endpoint }}
          MONID_ENABLE_RUN: ${{ inputs.paid_run && 'YES' || 'NO' }}
          MONID_OUTPUT: dr-hamad/monid/output/report.json
        run: node dr-hamad/monid/research.mjs
      - name: Upload editorial research report (not deployed to public site)
        uses: actions/upload-artifact@v4
        with:
          name: dr-hamad-monid-review-${{ github.run_number }}
          path: dr-hamad/monid/output/report.json
          retention-days: 7
          if-no-files-found: error

  weekly-monitor:
    needs: validate
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'discover')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run local SEO audit and free Monid discovery when configured
        env:
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
        run: node dr-hamad/monid/run-all.mjs
      - name: Upload weekly draft report (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: dr-hamad-weekly-seo-monid-${{ github.run_number }}
          path: dr-hamad/monid/output/
          retention-days: 7
          if-no-files-found: error
