name: Deploy Nitaq Al Amal Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'meta-artifact-viewer/**'
      - '.github/workflows/meta-artifact-viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate bilingual dashboard
        run: |
          node --check meta-artifact-viewer/nitaq-data.js
          node --check meta-artifact-viewer/nitaq-enhancements.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const root = 'meta-artifact-viewer';
          const required = ['index.html', 'nitaq-data.js', 'nitaq-enhancements.js', 'nitaq-enhancements.css'];
          for (const file of required) {
            if (!fs.existsSync(`${root}/${file}`)) throw new Error(`Missing required asset: ${file}`);
          }
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync(`${root}/nitaq-data.js`, 'utf8'), sandbox);
          const sites = sandbox.window.NITAQ_DATA?.sites || [];
          const counts = sites.reduce((result, site) => {
            result[site.type] = (result[site.type] || 0) + 1;
            return result;
          }, {});
          if (counts.generation !== 9 || counts.substation !== 32 || counts.monitoring !== 2) {
            throw new Error(`Unexpected site totals: ${JSON.stringify(counts)}`);
          }
          const html = fs.readFileSync(`${root}/index.html`, 'utf8');
          for (const asset of ['nitaq-data.js', 'nitaq-enhancements.js', 'nitaq-enhancements.css']) {
            if (!html.includes(asset)) throw new Error(`index.html does not load ${asset}`);
          }
          console.log('Validated 9 generation sites, 32 substations and 2 monitoring and control sites.');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: meta-artifact-viewer

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
