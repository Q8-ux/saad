name: Deploy Meta Artifact Viewer

on:
  push:
    branches: [main]
    paths:
      - 'meta-artifact-viewer/**'
      - '.github/workflows/meta-artifact-viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: meta-artifact-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: meta-artifact-viewer

      - name: Build application
        run: npm run build
        working-directory: meta-artifact-viewer

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: meta-artifact-viewer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
