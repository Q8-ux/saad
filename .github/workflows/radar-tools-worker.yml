name: Radar Tools Worker
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Worker duration after model readiness (1–20 minutes)'
        default: '15'
        required: true
        type: choice
        options: ['15', '5', '20']
  push:
    branches: [main]
    paths: ['social-request-radar/worker/**']
permissions:
  contents: read
  id-token: write
concurrency:
  group: radar-tools-worker
  cancel-in-progress: false
jobs:
  bounded-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: social-request-radar/worker/requirements.lock.txt}
      - uses: actions/cache@v4
        with:
          path: social-request-radar/worker/.cache/huggingface
          key: radar-model-e8f8c211226b894fcb81acc59f3b34ba3efd5f42
      - name: Install pinned CPU dependencies
        working-directory: social-request-radar
        run: |
          python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r worker/requirements.lock.txt
          python -m pip check
      - name: Verify bounded collectors and session guards
        working-directory: social-request-radar
        run: python -m unittest discover -s worker -p 'test_*.py'
      - name: Test actual Arabic model, then serve bounded jobs
        working-directory: social-request-radar
        env:
          RADAR_WORKER_MINUTES: ${{ inputs.minutes || '15' }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python worker/runner.py
      - name: Save package and synthetic model verification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-tools-runtime
          path: /tmp/radar-tools-runtime.json
          if-no-files-found: ignore
          retention-days: 7
