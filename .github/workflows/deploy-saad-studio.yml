name: Publish Saad Studio
on:
  push:
    branches: [main]
    paths: ['saad-studio/**', '.github/workflows/deploy-saad-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify editor and account isolation
        working-directory: saad-studio
        run: npm run check && npm test
      - uses: actions/configure-pages@v5
      - name: Preserve published sites
        env:
          GH_TOKEN: ${{ github.token }}
        run: python saad-studio/deployment/prepare.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 30
      - uses: actions/deploy-pages@v4
        id: deploy
