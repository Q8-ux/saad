name: Workforce Email and Auth Check

on:
  pull_request:
    branches: [main, workforce-platform]
    paths:
      - 'workforce-platform/apps/api/**'
      - 'workforce-platform/apps/web/**'
      - 'workforce-platform/.env.example'
      - 'workforce-platform/docker-compose.yml'
      - 'render.yaml'
      - '.github/workflows/workforce-email-check.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workforce-platform/apps/api/package-lock.json
      - name: Install API dependencies
        working-directory: workforce-platform/apps/api
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: workforce-platform/apps/api
        run: npm run prisma:generate
      - name: Run API tests
        working-directory: workforce-platform/apps/api
        run: npm test
      - name: Build API
        working-directory: workforce-platform/apps/api
        run: npm run build

  web:
    name: Static web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: workforce-platform/apps/web
        run: npm ci --no-audit --no-fund
      - name: Export GitHub Pages build
        working-directory: workforce-platform/apps/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
        run: npm run build
      - name: Verify email and account routes
        run: |
          for route in login activate forgot-password reset-password request-activation users; do
            if test -d "workforce-platform/apps/web/app/$route"; then
              test -s "workforce-platform/apps/web/out/$route/index.html"
            fi
          done
