name: Recover GitHub Pages Deployment
# One-time recovery for the Tamweenat GitHub release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workforce dependencies
        working-directory: workforce-platform/apps/web
        run: npm install --no-audit --no-fund

      - name: Build workforce platform
        working-directory: workforce-platform/apps/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: 'https://onefbrycdifaqghkzneh.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_M_L4mOwYjcAMbM5QXj2Nzw_4yXmrdXR'
          NEXT_PUBLIC_INTERFACE_VERSION: 'government-dashboard-live-data-v14'
        run: |
          rm -rf .next out
          npm run build

      - name: Prepare combined site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html cyber-archive.css cyber-archive.js cyber-data.js sabeq.html _site/
          cp -R sabeq-legal _site/sabeq-legal
          cp -R sabeq-admin-preview _site/sabeq-admin-preview
          cp -R sabeq-legal-system _site/sabeq-legal-system
          cp -R sabeq-legal-pro _site/sabeq-legal-pro
          cp -R shalayhna _site/shalayhna
          cp -R zad-restaurants _site/zad-restaurants
          cp -R tamweenat _site/tamweenat
          cp -R rattil _site/rattil
          cp -R workforce-platform/apps/web/out/_next _site/_next
          cp -R workforce-platform/apps/web/out/dashboard _site/dashboard
          cp -R workforce-platform/apps/web/out/attendance-smart _site/attendance-smart
          cp -R workforce-platform/apps/web/out/transfers _site/transfers
          cp -R workforce-platform/apps/web/out/emergency _site/emergency
          cp -R workforce-platform/apps/web/out/ai-tools _site/ai-tools
          cp -R workforce-platform/apps/web/out/notifications _site/notifications
          cp -R workforce-platform/apps/web/out/profile _site/profile
          echo 'government-dashboard-live-data-v14' > _site/interface-version.txt
          touch _site/.nojekyll

      - name: Validate combined site
        run: |
          test -s _site/index.html
          test -s _site/dashboard/index.html
          test -s _site/tamweenat/index.html
          test -s _site/tamweenat/assets/loader-cc76485c9c39.js
          grep -q 'نظام تموينات' _site/tamweenat/index.html
          grep -q 'q8-ux.github.io/saad/tamweenat' _site/tamweenat/index.html
          test -s _site/sabeq-legal/index.html
          test -s _site/shalayhna/index.html
          test -s _site/zad-restaurants/index.html
          test -s _site/rattil/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        uses: actions/deploy-pages@v4
