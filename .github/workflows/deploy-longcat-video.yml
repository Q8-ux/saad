name: Publish Saad Video Studio
on:
  push:
    branches: [main]
    paths: ['longcat-video/**', '.github/workflows/deploy-longcat-video.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate source
        run: |
          node --check longcat-video/app.js
          python -m py_compile longcat-video/backend/server.py longcat-video/backend/worker.py longcat-video/free-gpu/create_space.py
      - uses: actions/configure-pages@v5
      - name: Preserve published sites and overlay studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: python longcat-video/deployment/prepare.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 30
      - uses: actions/deploy-pages@v4
        id: deploy
