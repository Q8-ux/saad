name: Publish Ant Alshaer
on:
  push:
    branches: [main]
    paths: ['ant-alshaer/**', '.github/workflows/deploy-ant-alshaer.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Update Ant Alshaer and preserve published sites
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ant-alshaer/deployment/prepare.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 30
      - uses: actions/deploy-pages@v4
        id: deploy
