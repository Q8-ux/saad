name: Publish Family Writing Gateway Image

on:
  push:
    branches:
      - main
    paths:
      - family-online-studio/backend/Dockerfile
      - family-online-studio/backend/server.mjs
      - family-online-studio/backend/document-import.mjs
      - family-online-studio/backend/document-import.test.mjs
      - family-online-studio/backend/credentials.mjs
      - family-online-studio/backend/sms-auth.mjs
      - .github/workflows/publish-family-writing-gateway-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: family-writing-gateway-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/q8-ux/family-writing-gateway
  # Render still points at this historical tag. Keep it as a documented
  # compatibility alias until the service source can be changed to :latest.
  RENDER_COMPAT_TAG: 1f4dd4e03cfd62f71870354f9b90f637323e4233

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test gateway
        run: |
          node --test \
            family-online-studio/backend/credentials.test.mjs \
            family-online-studio/backend/document-import.test.mjs \
            family-online-studio/backend/server.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: family-online-studio/backend
          file: family-online-studio/backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.RENDER_COMPAT_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish package visibility
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/family-writing-gateway" \
            -f visibility=public

      - name: Verify anonymous image pull
        run: |
          docker logout ghcr.io
          docker image rm "${IMAGE_NAME}:${GITHUB_SHA}" 2>/dev/null || true
          for attempt in 1 2 3 4 5 6; do
            if docker pull "${IMAGE_NAME}:${GITHUB_SHA}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
