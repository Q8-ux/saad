name: Masar Translate Browser — Android APK
on:
  push:
    paths:
      - 'masar-translate-browser/**'
      - '.github/workflows/masar-translate-browser-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Build debug APK
        run: gradle -p masar-translate-browser :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: masar-translate-browser-debug-apk
          path: masar-translate-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
