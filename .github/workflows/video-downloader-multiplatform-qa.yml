name: Verify Multi Platform Media Provider
on:
  push:
    branches: [main]
    paths: ['video-downloader/qa/probe_multiplatform.py', '.github/workflows/video-downloader-multiplatform-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check external API and CORS
        run: python video-downloader/qa/probe_multiplatform.py
