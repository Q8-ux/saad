name: Publish Unknown Killer Robots
on:
  push:
    branches: [main]
    paths: ['unknown-killer-robots/**', '.github/workflows/deploy-unknown-killer-robots.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate film page and scoped publication
        run: |
          node --check unknown-killer-robots/dist/app.js
          node --check unknown-killer-robots/dist/sw.js
          node unknown-killer-robots/deployment/verify-sw.mjs
          python unknown-killer-robots/deployment/verify.py
          node --test social-request-radar/tests/pages-publication.test.mjs
      - uses: actions/configure-pages@v5
      - name: Preserve published projects and update film page only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python unknown-killer-robots/deployment/publish.py
      - name: Archive Pages artifact
        shell: bash
        run: |
          tar --dereference --hard-dereference --directory _site \
            --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        id: pages-artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Deploy
        id: deploy
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        with:
          script: |
            const deployPages = require('./.github/scripts/pages-deployment.cjs');
            await deployPages({github,context,core,artifactId:process.env.PAGES_ARTIFACT_ID});
      - name: Verify live page and source revision
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,time,urllib.request
          sha=os.environ['RELEASE_SHA']
          base='https://q8-ux.github.io/saad/unknown-killer-robots/'
          for attempt in range(8):
              try:
                  request=urllib.request.Request(base+'release-version.txt?commit='+sha,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      actual=response.read().decode().strip()
                  if actual==sha:
                      with urllib.request.urlopen(base+'?commit='+sha,timeout=20) as response:
                          page=response.read().decode()
                      assert 'Unknown: Killer Robots' in page and 'signature-stamp' in page and 'signature-link' in page and 'https://wa.me/' in page and 'tel:' not in page and 'Netflix' not in page
                      print('Film page and exact release verified:',sha)
                      break
              except Exception as error:
                  print('Waiting for release:',str(error))
              if attempt==7:
                  raise SystemExit('Live film page did not match the source commit')
              time.sleep(8)
          PY

