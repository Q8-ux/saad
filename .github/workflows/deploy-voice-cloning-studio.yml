name: Publish Arabic Voice Studio
on:
  push:
    branches: [main]
    paths: ['voice-cloning-studio/**', '.github/workflows/deploy-voice-cloning-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check client and audio export
        working-directory: voice-cloning-studio
        run: npm run check && npm test && python -m unittest discover -s tests -p 'test_*.py'
      - name: Check authenticated gateway
        working-directory: voice-cloning-studio
        run: |
          python -m pip install -r server/requirements-gateway.txt
          PYTHONPATH=server python -m unittest discover -s server/tests -p 'test_*.py'
      - uses: actions/configure-pages@v5
      - name: Preserve published sites and update voice studio only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python voice-cloning-studio/deployment/preserve.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site, retention-days: 30}
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
