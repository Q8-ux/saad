name: Sabeq independent admin memo sync checks
on:
  push:
    paths:
      - sabeq-admin-preview/admin.js
      - sabeq-admin-preview/tests/memo-sync-contract.test.mjs
      - .github/workflows/sabeq-independent-admin-memo-sync.yml
  pull_request:
    paths:
      - sabeq-admin-preview/admin.js
      - sabeq-admin-preview/tests/memo-sync-contract.test.mjs
      - .github/workflows/sabeq-independent-admin-memo-sync.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check sabeq-admin-preview/admin.js
      - run: node --test sabeq-admin-preview/tests/memo-sync-contract.test.mjs
