name: MarkItDown Service CI

on:
  push:
    paths:
      - "markitdown-service/**"
      - ".github/workflows/markitdown-service-ci.yml"
  pull_request:
    paths:
      - "markitdown-service/**"
      - ".github/workflows/markitdown-service-ci.yml"

permissions:
  contents: read

concurrency:
  group: markitdown-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: markitdown-service

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: markitdown-service/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check dependencies
        run: pip check
      - name: Lint
        run: ruff check app tests
      - name: Test
        env:
          MARKITDOWN_API_KEY: test-api-key
        run: pytest -q
