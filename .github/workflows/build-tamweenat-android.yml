name: Build Tamweenat Android Apps

on:
  pull_request:
    paths:
      - "tamweenat-android/**"
      - ".github/workflows/build-tamweenat-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify both APKs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and lint
        run: |
          gradle -p tamweenat-android clean \
            :app:lintRestaurantDebug \
            :app:lintAdminDebug \
            :app:assembleRestaurantDebug \
            :app:assembleAdminDebug \
            --stacktrace

      - name: Prepare named APKs
        run: |
          mkdir -p tamweenat-android/dist
          cp tamweenat-android/app/build/outputs/apk/restaurant/debug/app-restaurant-debug.apk \
            tamweenat-android/dist/Tamweenat-Restaurants.apk
          cp tamweenat-android/app/build/outputs/apk/admin/debug/app-admin-debug.apk \
            tamweenat-android/dist/Tamweenat-Admin.apk
          jarsigner -verify -certs tamweenat-android/dist/Tamweenat-Restaurants.apk
          jarsigner -verify -certs tamweenat-android/dist/Tamweenat-Admin.apk
          sha256sum tamweenat-android/dist/*.apk > tamweenat-android/dist/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tamweenat-android-apks
          path: tamweenat-android/dist/*
          if-no-files-found: error
          retention-days: 30
