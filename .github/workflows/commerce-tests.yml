name: Verified checkout tests
on:
  pull_request:
    paths: ['legal-memo-platform/**', '.github/workflows/commerce-tests.yml']
  push:
    branches: [main, feat/sabeq-verified-checkout]
    paths: ['legal-memo-platform/**', '.github/workflows/commerce-tests.yml']
jobs:
  commerce:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commerce_test
          POSTGRES_PASSWORD: test-only-local-ci
          POSTGRES_DB: commerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: legal-memo-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: legal-memo-platform/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Repeat commerce scenarios against PostgreSQL
        run: node --test test/commerce.test.js
        env:
          TEST_DATABASE_URL: postgresql://commerce_test:test-only-local-ci@localhost:5432/commerce_test
