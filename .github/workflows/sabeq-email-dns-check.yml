name: Sabeq email DNS readiness (read-only)

on:
  push:
    branches: [diagnostics/resend-check-20261102-1948]
    paths:
      - '.github/workflows/sabeq-email-dns-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect publicly visible Resend DNS records (no credentials or messages)
        shell: bash
        run: |
          set -euo pipefail
          echo 'Domain: sabeq.legal'
          echo '--- Authoritative nameservers ---'
          dig +short NS sabeq.legal | sort
          echo '--- SOA (DNS authority) ---'
          dig +short SOA sabeq.legal
          echo '--- Current main-domain MX, to preserve existing inbound mail ---'
          dig +short MX sabeq.legal | sort
          echo '--- Existing main-domain SPF/DMARC (values for diagnosis only) ---'
          dig +short TXT sabeq.legal | grep -i spf1 || true
          dig +short TXT _dmarc.sabeq.legal || true
          echo 'Note: Public DNS alone cannot establish which Resend team/key owns the domain, or whether delivery succeeds.'
          if dig +short TXT resend._domainkey.sabeq.legal | grep -q .; then
            echo 'Legacy Resend DKIM selector: PRESENT'
          else
            echo 'Legacy Resend DKIM selector: NOT FOUND (newer domains may use different selectors)'
          fi
          if dig +short TXT send.sabeq.legal | grep -qi 'spf1'; then
            echo 'Legacy send subdomain SPF: PRESENT'
          else
            echo 'Legacy send subdomain SPF: NOT FOUND (CNAME-based setups may be valid)'
          fi
          if dig +short MX send.sabeq.legal | grep -q .; then
            echo 'Legacy send MX: PRESENT'
          else
            echo 'Legacy send MX: NOT FOUND (CNAME-based setups may be valid)'
          fi
          if dig +short CNAME send.sabeq.legal | grep -q .; then
            echo 'New-style send CNAME: PRESENT'
          else
            echo 'New-style send CNAME: NOT FOUND'
          fi
          echo 'Authoritative sending status must be checked in the connected Resend team.'
          echo '--- Explicit Resend CNAME selectors ---'
          for host in rsend.sabeq.legal send.sabeq.legal; do
            echo "$host"
            dig +short CNAME "$host" || true
          done
      - name: Attempt authorized provider delivery test only when a GitHub Resend secret exists
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo 'SKIPPED: no RESEND_API_KEY available in GitHub Actions; the live Cloudflare/Resend configuration is not readable here.'
            exit 0
          fi
          echo 'Configured GitHub Resend secret exists (value never printed).'
          body='{"from":"noreplay@sabeq.legal","to":["saad.alrawdan@gmail.com"],"subject":"اختبار إرسال بريد سابق القانونية","text":"رسالة اختبار تقنية من نظام سابق القانونية للتحقق من إرسال البريد عبر Resend. لا تتضمن هذه الرسالة رمز دخول."}'
          status="$(curl -sS --max-time 25 -o /tmp/resend-result -w '%{http_code}' -X POST 'https://api.resend.com/emails' -H "Authorization: Bearer ${RESEND_API_KEY}" -H 'Content-Type: application/json' --data "$body")"
          echo "Resend send response HTTP: $status"
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/resend-result","utf8"));if(process.argv[1]==="200"||process.argv[1]==="201"){console.log("Resend accepted message, ID: "+(d.id||"missing"));}else{console.log("Resend rejected test; provider reason: "+(typeof d.message==="string"?d.message.slice(0,200):"unspecified"));}}' "$status"

