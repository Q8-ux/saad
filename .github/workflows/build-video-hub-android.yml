name: Build Video Hub Android APK

on:
  push:
    branches: [main]
    paths:
      - 'video-downloader/android/**'
      - '!video-downloader/android/releases/**'
      - '.github/workflows/build-video-hub-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-hub-android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: video-downloader/android
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$sdk" ] || [ ! -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK command line tools missing" >&2
            exit 1
          fi
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate native application source
        run: |
          test -s app/src/main/java/com/q8ux/videohub/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
          grep -Fq "MediaStore.Downloads.EXTERNAL_CONTENT_URI" app/src/main/java/com/q8ux/videohub/MainActivity.java
          grep -Fq "/api/public/info" app/src/main/java/com/q8ux/videohub/MainActivity.java
          grep -Fq "/api/public/download" app/src/main/java/com/q8ux/videohub/MainActivity.java
          grep -Fq "card.addView(downloadActions" app/src/main/java/com/q8ux/videohub/MainActivity.java
          ! grep -Fq "mp4Button.setEnabled(!on && !clipUrl.isEmpty())" app/src/main/java/com/q8ux/videohub/MainActivity.java
          if grep -Ei '(passwordInput|KEY_ALIAS|X-Download-Key)' app/src/main/java/com/q8ux/videohub/MainActivity.java; then
            echo "Unexpected password requirement in Android app" >&2; exit 1
          fi
          grep -Fq "Intent.ACTION_SEND" app/src/main/java/com/q8ux/videohub/MainActivity.java
          ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          ! grep -q 'android:usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package and signature
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$sdk/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$sdk/build-tools/35.0.0/aapt" dump badging "$apk" > build-badging.txt
          grep -Fq "name='com.q8ux.videohub.download.beta'" build-badging.txt
          grep -Fq "application-label" build-badging.txt
          grep -Fq "sdkVersion:'29'" build-badging.txt
          mkdir -p dist
          cp "$apk" dist/Video-Downloader-Android-v1.3.0.apk
          sha256sum dist/Video-Downloader-Android-v1.3.0.apk > dist/SHA256SUMS.txt
          cp build-badging.txt dist/build-badging.txt
          echo "APK packaging, manifest and signature verified."

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-hub-android-v1.3.0
          path: |
            video-downloader/android/dist/Video-Downloader-Android-v1.3.0.apk
            video-downloader/android/dist/SHA256SUMS.txt
            video-downloader/android/dist/build-badging.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub prerelease with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="video-hub-android-v1.3.0"
          apk="dist/Video-Downloader-Android-v1.3.0.apk"
          sha="dist/SHA256SUMS.txt"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$sha" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" "$sha" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "تحميل الفيديو Android v1.3.0 — تنزيل مباشر" \
              --prerelease \
              --notes "تطبيق Android أصلي يعمل دون كلمة مرور. يقبل روابط مشاركة الفيديو ويحمّل MP4 وMP3 من واجهة API مقيّدة بعدد الطلبات والحجم. يعمل على Android 10 فأحدث. هذا إصدار تجريبي موقّع بمفتاح Debug. لتفادي تعارض مفاتيح توقيع الإصدار القديم، يحمل التطبيق حزمة جديدة مستقلة؛ يمكنك حذف الإصدار القديم بعد تثبيت هذا الإصدار."
          fi
