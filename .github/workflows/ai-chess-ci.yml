name: AI Chess Kuwait Quality Check

on:
  pull_request:
    paths:
      - "ai-chess-python/**"
      - ".github/workflows/ai-chess-ci.yml"
  push:
    branches: [fix/ai-chess-render-history]
    paths:
      - "ai-chess-python/**"
      - ".github/workflows/ai-chess-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-chess-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-chess-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-chess-python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
