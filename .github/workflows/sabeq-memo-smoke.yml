name: Sabeq memo pipeline smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sabeq-memo-smoke.yml'
      - 'sabeq-legal/research-source/tests/management-source-connection.test.mjs'
      - 'sabeq-legal/research-source/lib/management-data.ts'
      - 'sabeq-legal/research-source/lib/memo-requests.ts'
      - 'sabeq-legal/research-source/lib/pleading-document.ts'
      - 'sabeq-legal/research-source/lib/bound-draft.ts'
      - 'sabeq-legal/research-source/app/api/legal/memo/route.ts'
      - 'sabeq-legal/research-source/tests/reference-memo-sequence.test.mjs'
      - 'sabeq-legal/research-source/specs/080-reference-memo-layout/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memo-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sabeq-legal/research-source/package-lock.json
      - name: Install isolated test dependencies
        working-directory: sabeq-legal/research-source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise memo creation, generated/all views and official archive bridge
        working-directory: sabeq-legal/research-source
        run: node --test tests/management-source-connection.test.mjs tests/reference-memo-sequence.test.mjs tests/article-text-in-memos.test.mjs tests/verified-article-narrative.test.mjs
      - name: Read-only public website and legacy gateway checks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 40 https://www.sabeq.legal/ > official.html
          grep -F 'q8-ux.github.io' official.html
          curl --fail --location --silent --show-error --retry 2 --max-time 40 https://q8-ux.github.io/saad/sabeq-legal/ > frontend.html
          node <<'JS'
          const fs = require('node:fs');
          const expected = fs.readFileSync('sabeq-legal/index.html', 'utf8');
          const actual = fs.readFileSync('frontend.html', 'utf8');
          const assets = [...expected.matchAll(/<script\b[^>]*\bsrc=["']([^"']+\.js(?:\?[^"']*)?)["']/g)].map(match => match[1]);
          if (!assets.length || assets.some(asset => !actual.includes(asset))) {
            throw new Error('The published frontend does not match the JavaScript entries in this commit.');
          }
          console.log('Published JavaScript entries match the checked-out source:', assets.length);
          JS
          curl --fail --location --silent --show-error --retry 2 --max-time 80 https://sabeq-legal-research-api.onrender.com/api/operations-health > gateway.json
          grep -F '"operations-monitor-1"' gateway.json
      - name: Check read-only public signing-key route and protected archive endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 -o jwks.json -w '%{http_code}' https://sabeq-legal-public.centrino.chatgpt.site/api/management/jwks)"
          echo "Sabeq JWKS HTTP status: $code"
          test "$code" = 200
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("jwks.json","utf8"));if(!Array.isArray(x.keys)||x.keys[0]?.kty!=="EC"||x.keys[0]?.crv!=="P-256"||x.keys[0]?.d)process.exit(1);console.log("Public verification key shape: valid")'
          code="$(curl --silent --show-error --max-time 30 -o archive-denied.json -w '%{http_code}' https://sabeq-legal-research-api.onrender.com/api/admin/operations)"
          echo "Legacy archive without token HTTP status: $code"
          test "$code" = 401
