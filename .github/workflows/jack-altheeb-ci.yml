name: Jack Altheeb CI

on:
  pull_request:
    paths:
      - 'jack-altheeb/**'
      - '.github/workflows/jack-altheeb-ci.yml'
  push:
    branches: [main]
    paths:
      - 'jack-altheeb/**'
      - '.github/workflows/jack-altheeb-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jack-altheeb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jack-altheeb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jack-altheeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high
