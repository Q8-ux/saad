name: Trigger Barcode Pages
on:
  push:
    branches: [main]
    paths:
      - 'barcode/**'
      - '.github/workflows/deploy-barcode-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Barcode
        run: test -s barcode/index.html
      - name: Touch main Pages workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit --allow-empty -m "Trigger combined Pages deploy for Barcode"
          git push
