name: Validate Sabeq Spec Kit

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'legal-memo-platform/AGENTS.md'
      - 'legal-memo-platform/.agents/**'
      - 'legal-memo-platform/.specify/**'
      - 'legal-memo-platform/specs/**'
      - 'legal-memo-platform/tools/spec-kit/**'
      - 'legal-memo-platform/.dockerignore'
      - '.github/workflows/sabeq-spec-kit.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'legal-memo-platform/AGENTS.md'
      - 'legal-memo-platform/.agents/**'
      - 'legal-memo-platform/.specify/**'
      - 'legal-memo-platform/specs/**'
      - 'legal-memo-platform/tools/spec-kit/**'
      - 'legal-memo-platform/.dockerignore'
      - '.github/workflows/sabeq-spec-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-memo-platform
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SPECIFY_FEATURE_NO_PERSIST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pinned helpers and monorepo isolation
        run: python -m unittest discover -s tools/spec-kit -p 'test_*.py' -v
      - name: Validate adoption specification prerequisites
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/001-spec-kit-adoption
        run: python .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
