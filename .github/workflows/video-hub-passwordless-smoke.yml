name: Video Hub Passwordless Android Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-hub-passwordless-smoke.yml'
  workflow_dispatch:

permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Verify public API without password and private API retains password protection
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, time
          base='https://video-hub-api-production.up.railway.app'
          video='https://www.youtube.com/watch?v=jNQXAC9IVRw'
          def req(route, value):
              return urllib.request.Request(base+route, method='POST', data=json.dumps(value).encode(), headers={'Content-Type':'application/json'})
          body={'url':video, 'quality':'360', 'kind':'video'}
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(base+'/api/health',timeout=20) as r:
                      data=json.load(r)
                  print('health status',data.get('status'),'public_app_mode',data.get('public_app_mode'))
                  assert data.get('public_app_mode') is True
                  break
              except Exception as e:
                  print('health retry',attempt+1,type(e).__name__)
                  time.sleep(6)
          else: raise SystemExit('Public app health was not ready')
          try:
              urllib.request.urlopen(req('/api/info',body),timeout=12)
              raise AssertionError('Private endpoint unexpectedly accepted request without password')
          except urllib.error.HTTPError as e:
              print('old private endpoint unauthenticated',e.code)
              assert e.code==401
          successful=None
          for platform, link in [('YouTube', video),('TikTok','https://vt.tiktok.com/ZSp6Vv81S/')]:
              probe=dict(body,url=link)
              try:
                  with urllib.request.urlopen(req('/api/public/info',probe),timeout=75) as r:
                      data=json.load(r)
                      print('PUBLIC INFO',platform,r.status,'detected',data.get('platform'))
                      assert r.status==200
                      successful=(platform,probe)
                      break
              except urllib.error.HTTPError as ex:
                  try:
                      detail=json.loads(ex.read(1500)).get('detail','')
                  except Exception:
                      detail='unavailable'
                  print('PUBLIC INFO UNAVAILABLE',platform,'status',ex.code,'detail',str(detail)[:170])
          if successful is None:
              raise SystemExit('Public API did not extract either permitted test video')
          try:
              with urllib.request.urlopen(req('/api/public/download',successful[1]),timeout=180) as r:
                  sample=r.read(20000000)
                  print('PUBLIC MP4',r.status,'bytes',len(sample),'type',r.headers.get('Content-Type'))
                  assert r.status==200 and len(sample)>20000 and sample[4:8]==b'ftyp'
          except urllib.error.HTTPError as ex:
              detail=json.loads(ex.read(1600)).get('detail','')
              print('PUBLIC MP4 UNAVAILABLE',ex.code,str(detail)[:200])
              raise
          print('PASS: Passwordless API returned a real MP4 and old endpoints remain secured')
          PY
      - name: Confirm source has no password screen and Android release asset exists
        run: |
          set -euo pipefail
          appfile="video-downloader/android/app/src/main/java/com/q8ux/videohub/MainActivity.java"
          ! grep -Eiq '(passwordInput|X-Download-Key|AndroidKeyStore)' "$appfile"
          grep -Fq '"/api/public/info"' "$appfile"
          grep -Fq '"/api/public/download"' "$appfile"
          curl --location --fail --silent --show-error --connect-timeout 15 --max-time 60 \
            "https://github.com/Q8-ux/saad/releases/download/video-hub-android-v1.1.0/Video-Hub-Android-v1.1.0.apk" \
            -o /tmp/video-hub.apk
          test "$(wc -c < /tmp/video-hub.apk)" -gt 30000
          unzip -t /tmp/video-hub.apk >/dev/null
          unzip -Z1 /tmp/video-hub.apk | grep -q '^classes.dex$'
          sha256sum /tmp/video-hub.apk
          echo "PASS: Android v1.1.0 APK downloadable without login and no password UI"
