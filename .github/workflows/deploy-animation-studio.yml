name: Publish Animation Studio
on:
  push:
    branches: [main]
    paths:
      - 'animation-studio/**'
      - '.github/workflows/deploy-animation-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Restore published sites and add Animation Studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior _site
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          if [ -n "$artifact_id" ] && [ "$artifact_id" != null ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > prior/site.zip
            unzip -q prior/site.zip -d prior
            tar -xf prior/artifact.tar -C _site
          else
            echo "No previous pages artifact. Refusing partial publish to avoid overwriting other sites."
            exit 1
          fi
          mkdir -p _site/animation-studio
          cp animation-studio/index.html animation-studio/style.css animation-studio/app.js _site/animation-studio/
          test -s _site/animation-studio/index.html
          test -s _site/animation-studio/app.js
          test -s _site/animation-studio/style.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 30
      - uses: actions/deploy-pages@v4
        id: deploy
