name: Reusable MarkItDown conversion

on:
  workflow_call:
    inputs:
      source-dir:
        description: Source directory in the caller repository
        required: false
        default: "."
        type: string
      mode:
        description: documents or all-supported
        required: false
        default: documents
        type: string
      max-file-size-mb:
        description: Maximum size of each input file
        required: false
        default: 50
        type: number

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Convert project documents
        uses: Q8-ux/saad/.github/actions/markitdown-batch@main
        with:
          source-dir: ${{ inputs.source-dir }}
          output-dir: .markitdown-output
          mode: ${{ inputs.mode }}
          max-file-size-mb: ${{ inputs.max-file-size-mb }}
          max-files: "250"
          max-output-characters: "5000000"
          timeout-seconds: "180"
          fail-on-error: "true"

      - name: Upload converted Markdown
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: markitdown-${{ github.event.repository.name }}-${{ github.run_number }}
          path: .markitdown-output
          if-no-files-found: warn
          retention-days: 7
