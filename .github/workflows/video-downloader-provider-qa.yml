name: Verify Video Downloader Live Provider
on:
  push:
    branches: [main]
    paths:
      - 'video-downloader/qa/**'
      - '.github/workflows/video-downloader-provider-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe public TikTok parser and CORS
        run: python video-downloader/qa/probe_provider.py
