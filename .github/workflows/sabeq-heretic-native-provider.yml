name: Sabeq Heretic native provider contract
on:
  pull_request:
    paths:
      - "sabeq-legal/research-source/lib/text-providers.ts"
      - "sabeq-legal/research-source/tests/text-providers.test.mjs"
      - ".github/workflows/sabeq-heretic-native-provider.yml"
  push:
    branches: [main]
    paths:
      - "sabeq-legal/research-source/lib/text-providers.ts"
      - "sabeq-legal/research-source/tests/text-providers.test.mjs"
      - ".github/workflows/sabeq-heretic-native-provider.yml"
permissions:
  contents: read
jobs:
  synthetic-legal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sabeq-legal/research-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sabeq-legal/research-source/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify text-only GGUF connector and schema guards
        run: node --test tests/text-providers.test.mjs
