name: Publish Arabic Social Desk
on:
  push:
    branches: [main]
    paths: ['social-desk/**', '.github/workflows/deploy-social-desk.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy All GitHub Pages Sites']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify Arabic Social Desk
        run: |
          node --check social-desk/app.js
          node --check social-desk/core.mjs
          node --test social-desk/tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Preserve published projects and add social desk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python social-desk/deployment/publish-pages.py
      - name: Archive GitHub Pages artifact
        shell: bash
        run: |
          tar --dereference --hard-dereference --directory _site \
            --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        id: pages-artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          stable=0
          for attempt in {1..20}; do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false and .size_in_bytes > 0) | .id] | if length == 1 then .[0] else empty end')" || artifact_id=""
            if [[ -n "$PAGES_ARTIFACT_ID" && "$artifact_id" == "$PAGES_ARTIFACT_ID" ]]; then
              stable=$((stable + 1))
              if [[ "$stable" -ge 3 ]]; then
                echo "Pages artifact $artifact_id is ready."
                exit 0
              fi
            else
              stable=0
            fi
            sleep 2
          done
          echo "::error::The uploaded Pages artifact metadata did not become uniquely available."
          exit 1
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

