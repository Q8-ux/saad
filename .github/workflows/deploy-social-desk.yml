name: Publish Arabic Social Desk
on:
  push:
    branches: [main]
    paths: ['social-desk/**', '.github/workflows/deploy-social-desk.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy All GitHub Pages Sites']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify Arabic Social Desk
        run: |
          node --check social-desk/app.js
          node --check social-desk/core.mjs
          node --test social-desk/tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Preserve published projects and add social desk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python social-desk/deployment/publish-pages.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site, retention-days: 30}
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
