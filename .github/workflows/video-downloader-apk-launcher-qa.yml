name: Video Downloader 1.4 APK Launcher QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/video-downloader-apk-launcher-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate published Android launcher and package without authentication
        shell: bash
        run: |
          set -euo pipefail
          apk=/tmp/tahmeel.apk
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 70 -sS \
            'https://github.com/Q8-ux/saad/releases/download/video-hub-android-v1.4.0/Tahmeel-Alvideo-v1.4.0.apk' -o "$apk"
          test "$(wc -c < "$apk")" -gt 50000
          unzip -t "$apk" >/dev/null
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          tool="$sdk/build-tools/35.0.0/aapt"
          if [ ! -x "$tool" ]; then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
          "$tool" dump badging "$apk" > /tmp/badging.txt
          grep "^package:" /tmp/badging.txt
          grep "^application-label" /tmp/badging.txt
          grep "^launchable-activity" /tmp/badging.txt
          grep -Fq "name='com.q8ux.videohub.clean.beta'" /tmp/badging.txt
          grep -Fq "versionName='1.4.0'" /tmp/badging.txt
          grep -Fq "com.q8ux.videohub.DownloadVideoActivity" /tmp/badging.txt
          echo 'PASS: Native launcher is the new offline-first screen; signed APK is downloadable.'
