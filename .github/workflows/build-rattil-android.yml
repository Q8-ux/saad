name: Build Rattil Android APK

on:
  push:
    branches:
      - main
    paths:
      - "rattil-android/**"
      - "!rattil-android/releases/**"
      - "rattil/**"
      - ".github/workflows/build-rattil-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Rattil Quran APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android licenses and install platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Lint and build APK
        run: |
          gradle -p rattil-android clean :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify and prepare APK
        run: |
          mkdir -p rattil-android/releases
          cp rattil-android/app/build/outputs/apk/debug/app-debug.apk rattil-android/releases/Rattil-Quran.apk
          jarsigner -verify -certs rattil-android/releases/Rattil-Quran.apk
          sha256sum rattil-android/releases/Rattil-Quran.apk > rattil-android/releases/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rattil-quran-android
          path: |
            rattil-android/releases/Rattil-Quran.apk
            rattil-android/releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f rattil-android/releases/Rattil-Quran.apk rattil-android/releases/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "APK is unchanged."
          else
            git commit -m "Rattil Android: publish APK [skip ci]"
            git push
          fi
