name: Screenplay Formatting

on:
  push:
    paths:
      - "screenplay-formatting/**"
      - ".github/workflows/screenplay-formatting.yml"
  pull_request:
    paths:
      - "screenplay-formatting/**"
      - ".github/workflows/screenplay-formatting.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: screenplay-formatting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screenplay-formatting/requirements.txt
      - name: Install native renderer
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fontconfig
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify imports and pagination
        run: python scripts/test_formatting.py
      - name: Export and verify Arabic sample
        run: python scripts/format_screenplay.py assets/example.json --out-dir out --stem sample --last-line-review
