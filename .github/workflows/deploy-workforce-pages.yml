name: Deploy Workforce Platform to GitHub Pages

on:
  push:
    branches: [workforce-platform]
    paths:
      - 'workforce-platform/apps/web/**'
      - '.github/workflows/deploy-workforce-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workforce-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workforce-platform/apps/web/package.json

      - name: Install dependencies
        working-directory: workforce-platform/apps/web
        run: npm install

      - name: Build static site
        working-directory: workforce-platform/apps/web
        run: npm run build

      - name: Add nojekyll marker
        run: touch workforce-platform/apps/web/out/.nojekyll

      - name: Verify exported files
        run: |
          test -f workforce-platform/apps/web/out/index.html
          test -f workforce-platform/apps/web/out/dashboard/index.html
          test -f workforce-platform/apps/web/out/attendance-smart/index.html
          test -f workforce-platform/apps/web/out/transfers/index.html
          test -f workforce-platform/apps/web/out/emergency/index.html
          test -f workforce-platform/apps/web/out/ai-tools/index.html
          test -f workforce-platform/apps/web/out/notifications/index.html
          test -f workforce-platform/apps/web/out/profile/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: workforce-platform/apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
