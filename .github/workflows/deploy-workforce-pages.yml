name: Deploy Workforce Platform to GitHub Pages

on:
  push:
    branches: [workforce-platform]
    paths:
      - 'workforce-platform/apps/web/**'
      - '.github/workflows/deploy-workforce-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce-platform/apps/web
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workforce-platform/apps/web/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: workforce-platform/apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
