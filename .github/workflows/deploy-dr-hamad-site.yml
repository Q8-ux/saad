name: Publish Dr Hamad Website
on:
  push:
    branches: [main]
    paths: ['dr-hamad/**', '.github/scripts/publish-dr-hamad-site.py', '.github/workflows/deploy-dr-hamad-site.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - name: Validate website
        run: |
          node --check dr-hamad/app.js
          node --check dr-hamad/experience.js
          node --check dr-hamad/site.js
          node dr-hamad/verify.cjs
      - name: Preserve current websites and add Dr Hamad website
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish-dr-hamad-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 30
      - uses: actions/deploy-pages@v4
        id: deploy
