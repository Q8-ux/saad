name: Publish Mirsad Arabic Website
on:
  push:
    branches: [main]
    paths: ['mirsad-web/**', '.github/workflows/deploy-mirsad-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate actual data boundaries and publication preservation
        run: |
          node --check mirsad-web/public/app.js
          node --check mirsad-web/public/web-provider.js
          node --check mirsad-web/public/sw.js
          node --test mirsad-web/tests/*.test.cjs
          python -m unittest discover -s mirsad-web/tests -p 'test_*.py'
          node --test social-request-radar/tests/pages-publication.test.mjs
      - uses: actions/configure-pages@v5
      - name: Preserve published sites and update Mirsad only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python mirsad-web/deployment/publish.py
      - name: Package the preserved Pages snapshot
        run: tar --dereference --hard-dereference --directory _site --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v7
        id: pages-artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 30
          if-no-files-found: error
      - name: Deploy exact uploaded artifact
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        with:
          script: |
            const deployPages = require('./.github/scripts/pages-deployment.cjs');
            await deployPages({github,context,core,artifactId:process.env.PAGES_ARTIFACT_ID});
