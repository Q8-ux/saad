name: Publish Social Request Radar
on:
  push:
    branches: [main]
    paths: ['social-request-radar/pages-dist/**', 'social-request-radar/github-pages/**', 'social-request-radar/deployment/**', '.github/workflows/deploy-social-request-radar.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy All GitHub Pages Sites']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify research, growth and browser-local workspace
        working-directory: social-request-radar
        run: |
          node --test tests/radar.test.mjs tests/pages-workspace.test.mjs
          node scripts/verify-github-pages.mjs
      - uses: actions/configure-pages@v5
      - name: Preserve published projects and add request radar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python social-request-radar/deployment/publish-pages.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site, retention-days: 30}
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
