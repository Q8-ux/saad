name: Deploy Workforce Platform

on:
  push:
    branches: [main]
    paths:
      - 'workforce-platform/apps/web/**'
      - '.github/workflows/deploy-workforce-platform.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workforce-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove every previous build artifact
        working-directory: workforce-platform/apps/web
        run: rm -rf .next out node_modules

      - name: Install clean dependencies
        working-directory: workforce-platform/apps/web
        run: npm install

      - name: Build current government dashboard
        working-directory: workforce-platform/apps/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_INTERFACE_VERSION: 'government-dashboard-live-clock-v2'
        run: npm run build

      - name: Verify the current dashboard build
        run: |
          test -f workforce-platform/apps/web/out/index.html
          test -f workforce-platform/apps/web/out/dashboard/index.html
          test -f workforce-platform/apps/web/out/attendance-smart/index.html
          test -f workforce-platform/apps/web/out/transfers/index.html
          test -f workforce-platform/apps/web/out/emergency/index.html
          test -f workforce-platform/apps/web/out/ai-tools/index.html
          test -f workforce-platform/apps/web/out/notifications/index.html
          test -f workforce-platform/apps/web/out/profile/index.html
          grep -R "government-dashboard-live-clock-v2" workforce-platform/apps/web/out/_next/static >/dev/null
          grep -R "liveClock" workforce-platform/apps/web/out/_next/static >/dev/null
          grep -R "approvedDashboard" workforce-platform/apps/web/out/_next/static >/dev/null

      - name: Add deployment version and disable Jekyll
        run: |
          echo 'government-dashboard-live-clock-v2' > workforce-platform/apps/web/out/interface-version.txt
          touch workforce-platform/apps/web/out/.nojekyll

      - name: Upload current interface only
        uses: actions/upload-pages-artifact@v3
        with:
          path: workforce-platform/apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Replace the entire previous site
        id: deployment
        uses: actions/deploy-pages@v4
