name: Deploy Workforce Platform

on:
  push:
    branches: [main]
    paths:
      - 'workforce-platform/apps/web/**'
      - '.github/workflows/deploy-workforce-platform.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: workforce-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove previous output
        working-directory: workforce-platform/apps/web
        run: rm -rf .next out node_modules

      - name: Install dependencies
        working-directory: workforce-platform/apps/web
        run: npm install --no-audit --no-fund

      - name: Build current dashboard
        id: app_build
        working-directory: workforce-platform/apps/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_INTERFACE_VERSION: 'government-dashboard-high-contrast-v5'
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../../../pages-build.log

      - name: Verify exported website
        run: |
          test -f workforce-platform/apps/web/out/index.html
          test -f workforce-platform/apps/web/out/dashboard/index.html
          test -d workforce-platform/apps/web/out/_next
          echo 'government-dashboard-high-contrast-v5' > workforce-platform/apps/web/out/interface-version.txt
          touch workforce-platform/apps/web/out/.nojekyll

      - name: Upload current interface
        uses: actions/upload-pages-artifact@v3
        with:
          path: workforce-platform/apps/web/out

      - name: Record build failure
        if: failure()
        shell: bash
        run: |
          {
            echo "status=build_failed"
            echo "version=government-dashboard-high-contrast-v5"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "log_tail_begin"
            tail -n 120 pages-build.log 2>/dev/null || true
            echo "log_tail_end"
          } > deployment-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-status.txt
          git commit -m "Record Pages build failure ${GITHUB_RUN_ID}" || true
          git push || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy and replace previous site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout main for status update
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record successful deployment
        shell: bash
        run: |
          {
            echo "status=deployed"
            echo "version=government-dashboard-high-contrast-v5"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "page_url=${{ steps.deployment.outputs.page_url }}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > deployment-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-status.txt
          git commit -m "Record successful Pages deployment ${GITHUB_RUN_ID}" || true
          git push || true
