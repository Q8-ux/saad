name: Workforce Platform Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: workforce-platform/apps/web
        run: npm install --no-audit --no-fund
      - name: Build workforce platform
        working-directory: workforce-platform/apps/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: 'https://onefbrycdifaqghkzneh.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_M_L4mOwYjcAMbM5QXj2Nzw_4yXmrdXR'
        run: npm run build
      - name: Verify dashboard export
        run: test -s workforce-platform/apps/web/out/dashboard/index.html
