name: Deploy Workforce Platform

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-workforce-platform.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workforce platform branch
        uses: actions/checkout@v4
        with:
          ref: workforce-platform
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: workforce-platform/apps/web
        run: npm install --no-audit --no-fund

      - name: Clean previous build
        working-directory: workforce-platform/apps/web
        run: rm -rf .next out

      - name: Build current workforce interface
        working-directory: workforce-platform/apps/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
        run: npm run build

      - name: Verify required pages and new enterprise shell
        run: |
          test -f workforce-platform/apps/web/out/index.html
          test -f workforce-platform/apps/web/out/dashboard/index.html
          test -f workforce-platform/apps/web/out/attendance-smart/index.html
          test -f workforce-platform/apps/web/out/transfers/index.html
          test -f workforce-platform/apps/web/out/emergency/index.html
          test -f workforce-platform/apps/web/out/ai-tools/index.html
          test -f workforce-platform/apps/web/out/notifications/index.html
          test -f workforce-platform/apps/web/out/profile/index.html
          grep -R "enterpriseShell" workforce-platform/apps/web/out/_next/static >/dev/null

      - name: Disable Jekyll processing
        run: touch workforce-platform/apps/web/out/.nojekyll

      - name: Upload only the current workforce platform
        uses: actions/upload-pages-artifact@v3
        with:
          path: workforce-platform/apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Replace the previous GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
