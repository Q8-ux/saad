name: Oman 1016 Static Preview Smoke
on:
  push:
    branches: [main]
    paths:
      - 'oman-fruits-commerce/app.js'
      - '.github/workflows/oman-preview-1016-smoke.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify no-login sales and admin previews despite backend unavailability
        run: |
          mkdir -p test-artifacts
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1280,height:900}});
          const origin='https://q8-ux.github.io/saad/oman-fruits-commerce/';
          try {
            for(const segment of ['sales/','manager/']){
              const page=await ctx.newPage();
              const errors=[];
              page.on('pageerror', e=>errors.push(e.message));
              // Force the backend to be unavailable to simulate Cloudflare 1016.
              await page.route('https://c--bd9ae430-2847-495f-9e07-72dd6eb16982-prod.lovable.cloud/**',route=>route.fulfill({status:530,contentType:'text/plain',body:'error code: 1016'}));
              const response=await page.goto(origin+segment+'?test='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
              console.log('PAGE',segment,'HTTP',response?.status(),'URL',page.url());
              await page.waitForTimeout(5000);
              console.log('BODY:',(await page.locator('body').innerText()).slice(0,1100));
              console.log('APP SRC:',await page.evaluate(()=>Array.from(document.scripts).map(x=>x.src).filter(Boolean)));
              console.log('PAGE ERRORS:',errors);
              const heading=segment.startsWith('sales')?'استقبال طلبات عمان — معاينة':'لوحة إدارة عمان — معاينة';
              await page.getByRole('heading',{name:heading}).waitFor({timeout:12000});
              await page.screenshot({path:'test-artifacts/'+segment.replace('/','')+'.png',fullPage:true});
              assert(!(await page.locator('body').innerText()).includes('تعذر تحميل المتجر'),'Unexpected backend error UI');
              assert.equal(errors.length,0,'Page JS errors: '+errors.join('; '));
              if(segment.startsWith('sales')){
                assert((await page.locator('[data-guest-add]').count())>=20,'Missing local products');
                await page.locator('[data-guest-add]').first().click();
                assert(!(await page.locator('#guest-total').innerText()).startsWith('0.000'),'Guest cart did not update');
              }else{
                await page.locator('[data-guest-tab="1"]').click();
                assert((await page.locator('#guest-admin-content').innerText()).includes('إدارة الموظفين'));
              }
              await page.close();
              console.log('PASS '+segment);
            }
          }finally{await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oman-1016-preview
          path: test-artifacts/
          if-no-files-found: ignore
