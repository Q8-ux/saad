name: Build Family Writing iOS
on:
  push:
    branches: [main]
    paths:
      - 'family-online-ios/Sources/**'
      - 'family-online-ios/UITests/**'
      - 'family-online-ios/tools/**'
      - 'family-online-ios/WritingStudio.xcodeproj/**'
      - 'family-online-iphone/**'
      - '.github/workflows/build-family-writing-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-writing-ios
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: family-online-ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select Xcode 26.3 for current Apple upload requirements
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Validate source and project
        run: |
          mkdir -p build
          xcodebuild -version > build/xcode-version.txt
          python3 tools/generate-project.py
          git diff --exit-code -- WritingStudio.xcodeproj
          plutil -lint WritingStudio.xcodeproj/project.pbxproj Sources/WritingStudio/Info.plist
          xcodebuild -list -project WritingStudio.xcodeproj -json > build/project-info.json
          python3 tools/check-source.py
          node tools/bridge.test.mjs
          node tools/pwa.test.mjs
          swiftc Sources/WritingStudio/StudioPolicy.swift tools/PolicySelfTest.swift -o build/policy-check
          build/policy-check
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > build/simulators.json
          simulator=$(python3 - <<'PY'
          import json
          data=json.load(open('build/simulators.json'))
          phones=[d for runtime,devices in data['devices'].items() if 'iOS' in runtime for d in devices if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones: raise SystemExit('No available iPhone simulator')
          print(phones[0]['udid'])
          PY
          )
          printf 'STUDIO_SIMULATOR=%s\n' "$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
      - name: Build and run an Arabic launch smoke test
        run: |
          set -o pipefail
          xcodebuild -project WritingStudio.xcodeproj -scheme WritingStudio -configuration Debug \
            -destination "platform=iOS Simulator,id=$STUDIO_SIMULATOR" \
            -derivedDataPath build/DerivedData -resultBundlePath build/Smoke.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test > build/simulator-test.log 2>&1 || { tail -n 100 build/simulator-test.log; exit 1; }
      - name: Archive an unsigned iPhone release
        run: |
          xcodebuild -project WritingStudio.xcodeproj -scheme WritingStudio -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/WritingStudio.xcarchive \
            -derivedDataPath build/ReleaseDerivedData CODE_SIGNING_ALLOWED=NO archive > build/iphone-archive.log 2>&1 || { tail -n 100 build/iphone-archive.log; exit 1; }
      - name: Package verified build evidence
        run: |
          package="$RUNNER_TEMP/family-writing-ios"
          mkdir -p "$package"
          ditto -c -k --sequesterRsrc --keepParent build/WritingStudio.xcarchive "$package/writing-studio-ios-unsigned.xcarchive.zip"
          ditto -c -k --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/WritingStudio.app "$package/writing-studio-ios-simulator.app.zip"
          cp build/xcode-version.txt build/project-info.json build/simulator-test.log build/iphone-archive.log "$package/"
          plutil -p build/WritingStudio.xcarchive/Products/Applications/WritingStudio.app/Info.plist > "$package/compiled-info.txt"
          python3 - <<'PY'
          import plistlib,json,pathlib
          app=pathlib.Path('build/WritingStudio.xcarchive/Products/Applications/WritingStudio.app')
          info=plistlib.loads((app/'Info.plist').read_bytes())
          privacy=plistlib.loads((app/'PrivacyInfo.xcprivacy').read_bytes())
          assert int(info['DTXcode'])>=2600
          assert int(info['DTSDKName'].removeprefix('iphoneos').split('.')[0])>=26
          assert privacy['NSPrivacyAccessedAPITypes'][0]['NSPrivacyAccessedAPITypeReasons']==['C617.1']
          result={'xcode_build_setting':info['DTXcode'],'sdk':info['DTSDKName'],'minimum_ios':info['MinimumOSVersion'],'privacy_manifest_embedded':True}
          pathlib.Path('build/archive-verification.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          cp build/archive-verification.json "$package/"
          file build/WritingStudio.xcarchive/Products/Applications/WritingStudio.app/WritingStudio > "$package/compiled-binary.txt"
          printf '%s\n' "$GITHUB_SHA" > "$package/source-commit.txt"
          printf '%s\n' 'Unsigned archive: requires Apple signing/provisioning before installing on an iPhone. Not a TestFlight release.' > "$package/DISTRIBUTION-STATUS.txt"
          (cd "$package" && shasum -a 256 *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: family-writing-ios-unsigned
          path: ${{ runner.temp }}/family-writing-ios
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: family-writing-ios-build-diagnostics
          path: |
            family-online-ios/build/*.log
            family-online-ios/build/*.txt
          retention-days: 3
          if-no-files-found: ignore
