name: Sabeq control login diagnostics

on:
  push:
    branches: [main]
    paths: [.github/workflows/sabeq-control-login-check.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-auth-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify management service and account configuration without real passwords
        shell: bash
        run: |
          set -euo pipefail
          origin='https://sabeq-legal-public.centrino.chatgpt.site'
          admin='https://q8-ux.github.io'
          key_status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "$origin/api/management/jwks")
          echo "Public management key endpoint: HTTP $key_status"
          test "$key_status" = 200
          login_status=$(curl --silent --show-error --max-time 60 -o /dev/null -w '%{http_code}' \
            -H "Origin: $admin" -H 'Content-Type: application/json' \
            -d '{"username":"synthetic_not_configured","password":"Synthetic-Invalid-Login-Only-2026!"}' \
            "$origin/api/management/password-login")
          echo "Unknown account login (401 expected if configured): HTTP $login_status"
          if [ "$login_status" = 401 ]; then
            echo 'PASS: service processed the login and rejected a nonexistent account'
          elif [ "$login_status" = 503 ]; then
            echo 'BLOCKER: live password login cannot read a usable account configuration'
            exit 1
          else
            echo "BLOCKER: unexpected login status $login_status"
            exit 1
          fi
      - name: Verify published login page, session protection and current browser assets
        shell: bash
        run: |
          set -euo pipefail
          page='https://q8-ux.github.io/saad/sabeq-admin-preview/'
          origin='https://sabeq-legal-public.centrino.chatgpt.site'
          curl --fail --location --silent --show-error --max-time 30 "$page" > admin-index.html
          grep -F 'admin.js?v=password-recovery-20261105' admin-index.html >/dev/null
          grep -F 'control.js?v=control-login-20261102-v2' admin-index.html >/dev/null
          echo 'PASS: deployed dashboard loads current username/password login asset'
          curl --fail --location --silent --show-error --max-time 30 'https://q8-ux.github.io/saad/sabeq-admin-preview/admin.js?v=password-recovery-20261105' > deployed-admin.js
          grep -F 'نسيت كلمة المرور؟' deployed-admin.js >/dev/null
          echo 'PASS: password recovery button is present in the published JavaScript'
          recovery_status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' -H 'Origin: https://q8-ux.github.io' -H 'Content-Type: application/json' -d '{"username":"!"}' "$origin/api/management/password-recovery-request")
          echo "Deployed recovery endpoint (synthetic invalid username, no email sent): HTTP $recovery_status"
          if [ "$recovery_status" = 200 ]; then echo 'PASS: deployed reset request endpoint is available'; else echo 'BLOCKER: backend reset route not deployed or not available yet'; fi
          session_status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' -H 'Origin: https://q8-ux.github.io' "$origin/api/management/session")
          echo "Anonymous management session HTTP status: $session_status"
          test "$session_status" = 401
