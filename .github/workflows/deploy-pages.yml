name: Deploy All GitHub Pages Sites

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 404.html
      - cyber-archive.css
      - cyber-archive.js
      - cyber-data.js
      - sabeq.html
      - 'sabeq-legal/**'
      - 'sabeq-admin-preview/**'
      - 'sabeq-legal-system/**'
      - 'sabeq-legal-pro/**'
      - 'hessa-alobaid/**'
      - 'shalayhna/**'
      - 'zad-restaurants/**'
      - 'tamweenat/**'
      - 'tamweenat-admin/**'
      - 'rattil/**'
      - 'etf-academy/**'
      - 'kuwait-digital-sales-plan/**'
      - 'kuwait-fund-modern/**'
      - 'livestock-vax-kw/**'
      - 'english-kuwait/**'
      - 'oman-fruits-pos/**'
      - 'project-command-center/**'
      - 'my-sites/**'
      - 'reddit-business-agent/**'
      - 'ant-alshaer/**'
      - 'ai-chess-kuwait/**'
      - 'ai-chess-python/**'
      - 'elanak-saleem/**'
      - 'alsaqaf-school/**'
      - 'youtube-studio-ai/**'
      - 'remote-ai-hub/**'
      - 'ai-video-studio/**'
      - 'autoclip-studio/**'
      - 'barcode/**'
      - 'frame-studio/**'
      - 'muhami-next/**'
      - 'workforce-platform/apps/web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions: { contents: write, actions: read, pages: write, id-token: write }
concurrency: { group: pages-v2, cancel-in-progress: true }
jobs:
  build-and-deploy:
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: Select release scope
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python sabeq-legal/deployment/release.py scope
      - name: Validate Sabeq publication safety
        if: steps.scope.outputs.sabeq_only == 'true'
        run: python sabeq-legal/deployment/test_release.py
      - uses: actions/configure-pages@v5
      - name: Restore published sites and update Sabeq only
        if: steps.scope.outputs.sabeq_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python sabeq-legal/deployment/release.py prepare
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.sabeq_only != 'true'
        with: { node-version: 22 }
      - name: Validate AutoClip Studio
        if: steps.scope.outputs.sabeq_only != 'true'
        working-directory: autoclip-studio
        run: npm test && npm run check
      - name: Validate Tamweenat assistant
        if: steps.scope.outputs.sabeq_only != 'true'
        run: |
          node --check tamweenat/assets/support-runtime.js
          node --check tamweenat/assets/voice-assistant.js
          node tamweenat/tests/voice-order-parser.test.cjs
          node tamweenat/tests/assistant-integration.test.cjs
      - name: Validate ETF learning paths
        if: steps.scope.outputs.sabeq_only != 'true'
        run: node --test etf-academy/tests/*.test.cjs
      - name: Install English audio dependency
        if: steps.scope.outputs.sabeq_only != 'true'
        run: sudo apt-get update -y && sudo apt-get install -y espeak
      - name: Install workforce dependencies
        if: steps.scope.outputs.sabeq_only != 'true'
        working-directory: workforce-platform/apps/web
        run: npm install --no-audit --no-fund
      - name: Build workforce platform
        if: steps.scope.outputs.sabeq_only != 'true'
        working-directory: workforce-platform/apps/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
          NEXT_PUBLIC_SUPABASE_URL: 'https://onefbrycdifaqghkzneh.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_M_L4mOwYjcAMbM5QXj2Nzw_4yXmrdXR'
          NEXT_PUBLIC_INTERFACE_VERSION: 'smart-assistant-flags-v23'
        run: rm -rf .next out && npm run build
      - name: Prepare combined site
        if: steps.scope.outputs.sabeq_only != 'true'
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html 404.html cyber-archive.css cyber-archive.js cyber-data.js sabeq.html _site/
          for p in sabeq-legal sabeq-admin-preview sabeq-legal-system sabeq-legal-pro hessa-alobaid shalayhna zad-restaurants tamweenat tamweenat-admin rattil etf-academy kuwait-digital-sales-plan kuwait-fund-modern livestock-vax-kw english-kuwait oman-fruits-pos project-command-center my-sites reddit-business-agent ant-alshaer ai-chess-kuwait elanak-saleem alsaqaf-school youtube-studio-ai remote-ai-hub noura-alattal ai-video-studio muhami-next barcode frame-studio; do cp -R "$p" "_site/$p"; done
          mkdir -p _site/saad-studio
          cp -R saad-studio/public/. _site/saad-studio/
          mkdir -p _site/autoclip-studio
          cp -R autoclip-studio/dist/. _site/autoclip-studio/
          bash english-kuwait/generate-audio.sh _site/english-kuwait/audio
          cp -R workforce-platform/apps/web/out/_next _site/_next
          for p in dashboard admin-control attendance-smart transfers emergency ai-tools notifications profile; do cp -R "workforce-platform/apps/web/out/$p" "_site/$p"; done
          echo 'smart-assistant-flags-v23' > _site/interface-version.txt
          touch _site/.nojekyll
      - name: Validate combined site
        if: steps.scope.outputs.sabeq_only != 'true'
        run: |
          test -s _site/404.html
          test -s _site/etf-academy/index.html
          node --check _site/etf-academy/app.js
          node --check _site/etf-academy/content.js
          node --check _site/etf-academy/calculations.js
          test -s _site/alsaqaf-school/index.html
          test -s _site/youtube-studio-ai/index.html
          test -s _site/remote-ai-hub/index.html
          test -s _site/noura-alattal/index.html
          test -s _site/noura-alattal/admin/index.html
          test -s _site/ai-video-studio/index.html
          test -s _site/barcode/index.html
          test -s _site/muhami-next/index.html
          test -s _site/autoclip-studio/index.html
          test -s _site/autoclip-studio/vendor/webm-duration.mjs
          test -s _site/alsaqaf-school/assets/learning-art.webp
          test -s _site/ant-alshaer/admin/login/index.html
          test -s _site/ai-chess-kuwait/index.html
          test -s _site/ai-chess-kuwait/embed.js
          test -s _site/dashboard/index.html
          test -s _site/ai-tools/index.html
          test -s _site/admin-control/index.html
          test -d _site/_next
      - name: Verify Sabeq publication and preserved sites
        if: steps.scope.outputs.sabeq_only == 'true'
        run: python sabeq-legal/deployment/release.py verify
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site, retention-days: 30 }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record Sabeq deployment
        if: steps.scope.outputs.sabeq_only == 'true'
        run: |
          echo 'Sabeq deployment succeeded for commit '\"$GITHUB_SHA\" >> "$GITHUB_STEP_SUMMARY"
          echo 'Unrelated sites preserved from the previous successful Pages artifact.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record deployment status
        if: steps.scope.outputs.sabeq_only != 'true'
        run: |
          printf 'status=deployed\nversion=smart-assistant-flags-v23\nrun_id=%s\ncommit=%s\npage_url=%s\ntime=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" '${{ steps.deployment.outputs.page_url }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > live-dashboard-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add live-dashboard-status.txt
          git commit -m "Record smart assistant deployment ${GITHUB_RUN_ID}" || true
          git push || true
