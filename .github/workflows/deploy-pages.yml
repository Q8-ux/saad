name: Deploy All GitHub Pages Sites

on:
  push:
    branches: [main]
    paths:
      - index.html
      - cyber-archive.css
      - cyber-archive.js
      - cyber-data.js
      - sabeq.html
      - 'sabeq-legal/**'
      - 'sabeq-admin-preview/**'
      - 'sabeq-legal-system/**'
      - 'sabeq-legal-pro/**'
      - 'shalayhna/**'
      - 'zad-restaurants/**'
      - 'tamweenat/**'
      - 'rattil/**'
      - 'workforce-platform/apps/web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workforce dependencies
        working-directory: workforce-platform/apps/web
        run: npm install --no-audit --no-fund

      - name: Build workforce platform
        working-directory: workforce-platform/apps/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: 'https://onefbrycdifaqghkzneh.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_M_L4mOwYjcAMbM5QXj2Nzw_4yXmrdXR'
          NEXT_PUBLIC_INTERFACE_VERSION: 'government-dashboard-live-data-v14'
        run: |
          rm -rf .next out
          npm run build

      - name: Prepare combined site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html cyber-archive.css cyber-archive.js cyber-data.js sabeq.html _site/
          cp -R sabeq-legal _site/sabeq-legal
          cp -R sabeq-admin-preview _site/sabeq-admin-preview
          cp -R sabeq-legal-system _site/sabeq-legal-system
          cp -R sabeq-legal-pro _site/sabeq-legal-pro
          cp -R shalayhna _site/shalayhna
          cp -R zad-restaurants _site/zad-restaurants
          cp -R tamweenat _site/tamweenat
          cp -R rattil _site/rattil
          cp -R workforce-platform/apps/web/out/_next _site/_next
          cp -R workforce-platform/apps/web/out/dashboard _site/dashboard
          cp -R workforce-platform/apps/web/out/attendance-smart _site/attendance-smart
          cp -R workforce-platform/apps/web/out/transfers _site/transfers
          cp -R workforce-platform/apps/web/out/emergency _site/emergency
          cp -R workforce-platform/apps/web/out/ai-tools _site/ai-tools
          cp -R workforce-platform/apps/web/out/notifications _site/notifications
          cp -R workforce-platform/apps/web/out/profile _site/profile
          echo 'government-dashboard-live-data-v14' > _site/interface-version.txt
          touch _site/.nojekyll

      - name: Validate combined site
        run: |
          test -s _site/index.html
          test -s _site/dashboard/index.html
          test -s _site/attendance-smart/index.html
          test -s _site/ai-tools/index.html
          test -d _site/_next
          grep -q 'Smart Operations Center' _site/dashboard/index.html
          test -s _site/sabeq-legal/index.html
          test -s _site/sabeq-admin-preview/index.html
          test -s _site/sabeq-legal-system/index.html
          test -s _site/sabeq-legal-pro/index.html
          test -s _site/shalayhna/index.html
          test -s _site/zad-restaurants/index.html
          test -s _site/tamweenat/index.html
          test -s _site/rattil/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment status
        run: |
          {
            echo "status=deployed"
            echo "version=government-dashboard-live-data-v14"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "page_url=${{ steps.deployment.outputs.page_url }}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > live-dashboard-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add live-dashboard-status.txt
          git commit -m "Record live dashboard deployment ${GITHUB_RUN_ID}" || true
          git push || true
