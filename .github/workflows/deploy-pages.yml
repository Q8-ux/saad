name: Deploy All GitHub Pages Sites

on:
  push:
    branches: [main]
    paths:
      - index.html
      - cyber-archive.css
      - cyber-archive.js
      - cyber-data.js
      - sabeq.html
      - 'sabeq-legal/**'
      - 'sabeq-admin-preview/**'
      - 'sabeq-legal-system/**'
      - 'sabeq-legal-pro/**'
      - 'shalayhna/**'
      - 'zad-restaurants/**'
      - 'tamweenat/**'
      - 'tamweenat-admin/**'
      - 'rattil/**'
      - 'kuwait-digital-sales-plan/**'
      - 'kuwait-fund-modern/**'
      - 'livestock-vax-kw/**'
      - 'workforce-platform/apps/web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install workforce dependencies
        working-directory: workforce-platform/apps/web
        run: npm install --no-audit --no-fund
      - name: Build workforce platform
        working-directory: workforce-platform/apps/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: 'https://workforce-platform-api.onrender.com/api'
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: 'https://onefbrycdifaqghkzneh.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_M_L4mOwYjcAMbM5QXj2Nzw_4yXmrdXR'
          NEXT_PUBLIC_INTERFACE_VERSION: 'compact-mobile-header-v21'
        run: |
          rm -rf .next out
          npm run build
      - name: Prepare combined site
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html cyber-archive.css cyber-archive.js cyber-data.js sabeq.html _site/
          cp -R sabeq-legal _site/sabeq-legal
          cp -R sabeq-admin-preview _site/sabeq-admin-preview
          cp -R sabeq-legal-system _site/sabeq-legal-system
          cp -R sabeq-legal-pro _site/sabeq-legal-pro
          cp -R shalayhna _site/shalayhna
          cp -R zad-restaurants _site/zad-restaurants
          cp -R tamweenat _site/tamweenat
          cp -R tamweenat-admin _site/tamweenat-admin
          cp -R rattil _site/rattil
          cp -R kuwait-digital-sales-plan _site/kuwait-digital-sales-plan
          cp -R kuwait-fund-modern _site/kuwait-fund-modern
          cp -R livestock-vax-kw _site/livestock-vax-kw
          cp -R workforce-platform/apps/web/out/_next _site/_next
          for p in dashboard admin-control attendance-smart transfers emergency ai-tools notifications profile; do cp -R "workforce-platform/apps/web/out/$p" "_site/$p"; done
          echo 'compact-mobile-header-v21' > _site/interface-version.txt
          touch _site/.nojekyll
      - name: Validate combined site
        run: |
          test -s _site/dashboard/index.html
          test -s _site/admin-control/index.html
          test -s _site/livestock-vax-kw/index.html
          test -s _site/livestock-vax-kw/admin/index.html
          test -d _site/_next
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment status
        run: |
          printf 'status=deployed\nversion=compact-mobile-header-v21\nrun_id=%s\ncommit=%s\npage_url=%s\ntime=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" '${{ steps.deployment.outputs.page_url }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > live-dashboard-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add live-dashboard-status.txt
          git commit -m "Record mobile header deployment ${GITHUB_RUN_ID}" || true
          git push || true
