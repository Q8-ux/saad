name: Deploy Cyber Case Archive

on:
  push:
    branches: [main]
    paths:
      - index.html
      - cyber-archive.css
      - cyber-archive.js
      - cyber-data.js
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static archive
        run: |
          mkdir -p _site
          cp index.html cyber-archive.css cyber-archive.js cyber-data.js _site/
          touch _site/.nojekyll

      - name: Validate archive files
        run: |
          test -s _site/index.html
          test -s _site/cyber-archive.css
          test -s _site/cyber-archive.js
          test -s _site/cyber-data.js
          grep -q 'cyber-data.js' _site/index.html
          grep -q 'CYBER_DATA' _site/cyber-data.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
