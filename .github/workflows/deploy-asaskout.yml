name: Publish Asas Kout Arabic and English
on:
  push:
    branches: [main]
    paths: ['asaskout/**', '.github/workflows/deploy-asaskout.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build and validate both languages
        working-directory: asaskout
        run: node build.mjs && node verify.mjs && node --check assets/site.mjs
      - uses: actions/configure-pages@v5
      - name: Preserve published projects and update Asas Kout only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python asaskout/deployment/publish.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site, retention-days: 30}
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify the live source revision
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,time,urllib.request
          sha=os.environ['RELEASE_SHA']
          url='https://q8-ux.github.io/saad/asaskout/release-version.txt?commit='+sha
          for attempt in range(8):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      actual=response.read().decode().strip()
                  if actual==sha:
                      print('Asas Kout live release verified:',sha)
                      break
              except Exception as error:
                  print('Waiting for release:',str(error))
              if attempt==7:
                  raise SystemExit('Live site revision has not matched the source commit')
              time.sleep(8)
          PY
