name: Publish Sinad Kuwait
on:
  push:
    branches: [main]
    paths: ['manhaj/**', 'sinad-kuwait/**', '.github/workflows/deploy-sinad-kuwait.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Check sources
        run: |
          node --check sinad-kuwait/app.js
          node --check sinad-kuwait/workflows.js
          node sinad-kuwait/scripts/check_workflows.cjs
          node --test sinad-kuwait/backend/server.test.mjs
          node sinad-kuwait/scripts/check_app.cjs
          python -m py_compile sinad-kuwait/scripts/*.py sinad-kuwait/deployment/*.py
          python sinad-kuwait/scripts/check_catalog.py
      - name: Prepare curriculum reader
        run: |
          npm install --prefix /tmp/manhaj-pdf --ignore-scripts --no-audit --no-fund pdfjs-dist@5.6.205
          python -m pip install 'scrapling==0.4.15'
          python -c "from scrapling.parser import Selector; assert Selector('<p>ready</p>').css('p::text').get() == 'ready'"
          node manhaj/analysis/check.cjs
          node manhaj/language-check.cjs
      - uses: actions/configure-pages@v5
      - name: Preserve published sites and overlay Sinad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python sinad-kuwait/deployment/prepare.py
          mkdir -p _site/manhaj
          cp manhaj/index.html _site/manhaj/index.html
          python -c "import shutil; shutil.rmtree('_site/manhaj/data', ignore_errors=True); shutil.copytree('manhaj/data', '_site/manhaj/data')"
          mkdir -p _site/manhaj/vendor/pdfjs
          cp /tmp/manhaj-pdf/node_modules/pdfjs-dist/build/pdf.mjs /tmp/manhaj-pdf/node_modules/pdfjs-dist/build/pdf.worker.mjs _site/manhaj/vendor/pdfjs/
          cp -r /tmp/manhaj-pdf/node_modules/pdfjs-dist/cmaps /tmp/manhaj-pdf/node_modules/pdfjs-dist/standard_fonts _site/manhaj/vendor/pdfjs/
          cp /tmp/manhaj-pdf/node_modules/pdfjs-dist/LICENSE _site/manhaj/vendor/pdfjs/
          test -s _site/manhaj/index.html
          test -s _site/manhaj/data/curricula.sqlite
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site, retention-days: 30}
      - uses: actions/deploy-pages@v4
        id: deploy
