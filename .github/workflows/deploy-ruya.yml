name: Publish Ruya Platform
on:
  push:
    branches: [main]
    paths: ['ruya/**', '.github/workflows/deploy-ruya.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy All GitHub Pages Sites']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify provenance and reading boundaries
        working-directory: ruya
        run: npm test && npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Preserve published projects and update Ruya only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ruya/deployment/publish.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 30
      - uses: actions/deploy-pages@v4
        id: deploy
