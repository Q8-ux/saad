name: Sabeq internal release checks

on:
  push:
    branches: [main]
    paths:
      - 'legal-memo-platform/tools/internal-verification/**'
      - 'legal-memo-platform/test/**'
      - 'legal-memo-platform/*.js'
      - 'legal-memo-platform/package.json'
      - 'legal-memo-platform/specs/006-internal-verification/**'
      - '.github/workflows/sabeq-internal-verification.yml'
  pull_request:
    paths:
      - 'legal-memo-platform/**'
      - 'sabeq-legal/deployment/**'
      - '.github/workflows/sabeq-internal-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sabeq-internal-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: legal-memo-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned verification engine
        run: python -m pip install -r tools/internal-verification/requirements.txt
      - name: Exercise refusal and evidence privacy
        run: python -m unittest discover -s tools/internal-verification -p 'test_*.py' -v
      - name: Verify backend checks with observed receipts
        run: npm run verify:internal
