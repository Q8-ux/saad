name: Oman Employee POS Redesign QA
on:
  push:
    branches: [main]
    paths:
      - 'oman-fruits-commerce/app.js'
      - 'oman-fruits-commerce/sales/**'
      - '.github/workflows/oman-sales-redesign-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check oman-fruits-commerce/app.js
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify customer-facing phone order workstation under 1016
        shell: bash
        run: |
          mkdir -p test-artifacts
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const base='https://q8-ux.github.io/saad/oman-fruits-commerce/sales/';
          try{
            for(const size of [{width:1570,height:950},{width:390,height:844}]){
              const page=await browser.newPage({viewport:size});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('https://c--bd9ae430-2847-495f-9e07-72dd6eb16982-prod.lovable.cloud/**',r=>r.fulfill({status:530,contentType:'text/plain',body:'error code: 1016'}));
              const result=await page.goto(base+'?version=pos-redesign-20261123',{waitUntil:'domcontentloaded',timeout:45000});
              assert.equal(result.status(),200,'Sales page HTTP must be 200');
              await page.locator('.pos-preview').waitFor({timeout:30000});
              assert((await page.locator('h1').innerText()).includes('استقبال طلبات عمان'));
              const bodyText=await page.locator('body').innerText();
              assert(!bodyText.includes('لوحة المدير'),'Employee screen must not show admin dashboard');
              assert(!bodyText.includes('تعذر تحميل المتجر'),'Cloudflare 1016 should not blank preview');
              const headingPx=await page.locator('.pos-panel-head h2').first().evaluate(el=>parseFloat(getComputedStyle(el).fontSize));
              const productTitlePx=await page.locator('.pos-product-info h3').first().evaluate(el=>parseFloat(getComputedStyle(el).fontSize));
              console.log('Typography:',headingPx,productTitlePx);
              assert(headingPx>=23,'Section heading font too small');
              if(size.width>500)assert(productTitlePx>=19,'Desktop product names too small');
              const products=await page.locator('.pos-product-card').count();
              console.log('Products:',products);
              assert(products>=20,'Product grid missing');
              await page.locator('#pos-search').fill('أفوكادو');
              assert((await page.locator('.pos-product-card').count())>=1,'Search not working');
              await page.locator('#pos-search').fill('');
              await page.locator('[data-pos-category="vegetables"]').click();
              assert((await page.locator('.pos-product-card').count())>=1,'Category filtering broken');
              await page.locator('[data-pos-category="all"]').click();
              await page.locator('[data-guest-add]').first().click();
              assert(!(await page.locator('#guest-total').innerText()).startsWith('0.000'),'Cart add failed');
              await page.locator('[data-pos-preview-plus]').first().click();
              await page.locator('#pos-repeat').click();
              assert((await page.locator('.pos-cart-row').count())>=2,'Reorder example missing');
              assert((await page.locator('#pos-repeat-status').innerText()).includes('تمت إعادة'),'Reorder status missing');
              await page.screenshot({path:'test-artifacts/oman-pos-'+size.width+'.png',fullPage:true});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              console.log('Screen:',size.width,'Horizontal overflow:',overflow);
              assert(overflow<15,'Large horizontal overflow');
              assert.deepEqual(errors,[],'Javascript errors: '+errors.join('|'));
              console.log('PASS size',size.width);
              await page.close();
            }
          }finally{await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oman-employee-pos-redesign-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
# post-deploy verification of large Arabic typography and cart
