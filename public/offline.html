<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>منصة العقود والترجمة القانونية | لا يوجد اتصال</title>
    <style>
      @font-face{font-family:Mohanad;src:url('/fonts/AL-Mohanad.ttf') format('truetype');font-display:swap}
      @font-face{font-family:Mohanad;src:url('/fonts/AL-Mohanad-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0,#123463,#07111f 48%);color:#fff;font-family:Mohanad,Tahoma,Arial,sans-serif}
      main{width:min(460px,100%);padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.055);text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.3)}
      .mark{width:78px;height:78px;display:grid;place-items:center;margin:0 auto 20px;border-radius:22px;background:linear-gradient(135deg,#4b8dff,#174ca9);font-size:2.4rem;font-weight:700}
      h1{margin:0 0 9px;font-size:1.65rem}p{margin:0 0 22px;color:#b8c7da;line-height:1.8}
      button{min-height:48px;border:0;border-radius:13px;padding:10px 24px;background:#347cf2;color:#fff;font:700 1rem Mohanad,Tahoma,sans-serif;cursor:pointer}
      small{display:block;margin-top:20px;color:#8294aa;direction:ltr}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ق</div>
      <h1 id="title">لا يوجد اتصال بالإنترنت</h1>
      <p id="copy">يحتاج البحث القانوني والبيانات المحدثة إلى اتصال آمن. لن يعرض التطبيق نتائج قديمة على أنها حالية.</p>
      <button id="retry" type="button" onclick="location.reload()">إعادة المحاولة</button>
      <small>Legal Office Platform</small>
    </main>
    <script>
      const lang=(navigator.language||'ar').toLowerCase();
      if(lang.startsWith('en')){document.documentElement.lang='en';document.documentElement.dir='ltr';title.textContent='No internet connection';copy.textContent='Legal search and current office data require a secure connection. The app will not present stale results as current.';retry.textContent='Try again'}
      if(lang.startsWith('ur')){document.documentElement.lang='ur';document.documentElement.dir='rtl';title.textContent='انٹرنیٹ کنکشن موجود نہیں';copy.textContent='قانونی تلاش اور تازہ دفتر کے ڈیٹا کے لیے محفوظ کنکشن ضروری ہے۔ ایپ پرانے نتائج کو موجودہ ظاہر نہیں کرے گی۔';retry.textContent='دوبارہ کوشش کریں'}
    </script>
  </body>
</html>
