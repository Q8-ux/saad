<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>نظام الحضور والانصراف</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07111f;--surface:#101d30;--surface2:#17263d;--text:#f8fafc;--muted:#93a4ba;--border:#263750;--accent:#32d296;--danger:#fb7185;--warning:#fbbf24}
.light{--bg:#f3f7fb;--surface:#fff;--surface2:#f8fafc;--text:#102033;--muted:#64748b;--border:#dbe4ef}
*{box-sizing:border-box}body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--text);transition:.25s}.surface{background:var(--surface)}.surface2{background:var(--surface2)}.muted{color:var(--muted)}.borderx{border-color:var(--border)}
.btn{border:1px solid var(--border);border-radius:.8rem;padding:.65rem .95rem;font-weight:700}.btn-primary{background:var(--accent);color:#052e26;border-color:transparent}.badge{padding:.3rem .65rem;border-radius:999px;font-size:.75rem;font-weight:700}.present{background:#0f513240;color:#65f2b3}.late{background:#7c4a0345;color:#ffd27a}.absent{background:#7f1d1d45;color:#ff9b9b}.checkedout{background:#164e6345;color:#7dd3fc}.modal{background:rgba(2,6,23,.72)}input,select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:.75rem;padding:.7rem .8rem;width:100%}
</style>
</head>
<body class="min-h-screen">
<header class="border-b borderx px-5 py-4 sticky top-0 z-20" style="background:var(--bg)"><div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4"><div><h1 id="title" class="text-2xl font-extrabold">نظام الحضور والانصراف</h1><p id="subtitle" class="muted text-sm mt-1">لوحة تشغيل تجريبية — حفظ البيانات على الجهاز</p></div><div class="flex flex-wrap gap-2"><button id="addEmployee" class="btn btn-primary">+ موظف</button><button id="exportCsv" class="btn surface">تصدير CSV</button><button id="lang" class="btn surface">EN</button><button id="theme" class="btn surface" aria-label="تغيير المظهر">☀️</button></div></div></header>
<main class="max-w-7xl mx-auto p-5 md:p-7">
<section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-7">
<div class="surface border borderx rounded-2xl p-5"><p id="p1" class="muted text-sm">إجمالي الموظفين</p><strong id="total" class="text-4xl block mt-2">0</strong></div>
<div class="surface border borderx rounded-2xl p-5"><p id="p2" class="muted text-sm">الحاضرون</p><strong id="presentCount" class="text-4xl block mt-2">0</strong></div>
<div class="surface border borderx rounded-2xl p-5"><p id="p3" class="muted text-sm">المتأخرون</p><strong id="lateCount" class="text-4xl block mt-2">0</strong></div>
<div class="surface border borderx rounded-2xl p-5"><p id="p4" class="muted text-sm">الغائبون</p><strong id="absentCount" class="text-4xl block mt-2">0</strong></div>
</section>
<section class="surface border borderx rounded-2xl p-5 mb-7 grid lg:grid-cols-[1fr_auto] gap-5 items-end"><div class="grid md:grid-cols-3 gap-3"><div><label id="searchLabel" class="text-sm muted">بحث</label><input id="search" placeholder="الاسم أو الرقم الوظيفي"></div><div><label id="filterLabel" class="text-sm muted">الحالة</label><select id="filter"><option value="all">الكل</option><option value="present">حاضر</option><option value="late">متأخر</option><option value="absent">غائب</option><option value="checkedout">غادر</option></select></div><div><label id="dateLabel" class="text-sm muted">التاريخ</label><input id="date" type="date"></div></div><button id="simulateQr" class="btn btn-primary whitespace-nowrap">تسجيل عبر QR</button></section>
<section class="surface border borderx rounded-2xl overflow-hidden"><div class="p-5 border-b borderx flex flex-wrap justify-between gap-2 items-center"><h2 id="tableTitle" class="font-bold text-lg">سجل الحضور اليومي</h2><span id="now" class="muted text-sm"></span></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="surface2"><tr><th id="h1" class="p-4 text-start">الموظف</th><th id="h2" class="p-4 text-start">القسم</th><th id="h3" class="p-4 text-start">الحالة</th><th id="h4" class="p-4 text-start">الدخول</th><th id="h5" class="p-4 text-start">الخروج</th><th id="h6" class="p-4 text-start">إجراء</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="hidden text-center muted p-10">لا توجد نتائج</div></section>
</main>
<div id="employeeModal" class="modal hidden fixed inset-0 z-50 p-4 items-center justify-center"><form id="employeeForm" class="surface border borderx rounded-2xl p-6 w-full max-w-md"><div class="flex justify-between items-center mb-5"><h3 id="modalTitle" class="text-xl font-bold">إضافة موظف</h3><button type="button" class="text-2xl" data-close>×</button></div><div class="space-y-4"><div><label id="nameLabel" class="text-sm muted">الاسم</label><input id="empName" required></div><div><label id="idLabel" class="text-sm muted">الرقم الوظيفي</label><input id="empId" required></div><div><label id="deptLabel" class="text-sm muted">القسم</label><input id="empDept" required></div><button id="saveEmployee" class="btn btn-primary w-full">حفظ</button></div></form></div>
<div id="qrModal" class="modal hidden fixed inset-0 z-50 p-4 items-center justify-center"><div class="surface border borderx rounded-2xl p-6 w-full max-w-md text-center"><div class="flex justify-between items-center mb-5"><h3 id="qrTitle" class="text-xl font-bold">تسجيل الحضور</h3><button class="text-2xl" data-close>×</button></div><div class="surface2 rounded-2xl w-48 h-48 mx-auto grid place-items-center text-7xl">▦</div><p id="qrHint" class="muted mt-4">اختر الموظف لمحاكاة مسح رمز QR</p><select id="qrEmployee" class="mt-4"></select><button id="confirmQr" class="btn btn-primary w-full mt-4">تأكيد التسجيل</button></div></div>
<script>
const seed=[{id:'E1001',name:'أحمد العتيبي',dept:'التشغيل',status:'present',in:'07:41',out:''},{id:'E1002',name:'سارة القحطاني',dept:'الموارد البشرية',status:'late',in:'08:17',out:''},{id:'E1003',name:'محمد العنزي',dept:'الأمن والسلامة',status:'present',in:'07:53',out:''},{id:'E1004',name:'نورة الشمري',dept:'المالية',status:'absent',in:'',out:''}];
let employees=JSON.parse(localStorage.getItem('attendanceEmployees')||'null')||seed,ar=true,dark=true;const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);
const words={ar:{all:'الكل',present:'حاضر',late:'متأخر',absent:'غائب',checkedout:'غادر',checkin:'تسجيل دخول',checkout:'تسجيل خروج',delete:'حذف',none:'لا توجد نتائج'},en:{all:'All',present:'Present',late:'Late',absent:'Absent',checkedout:'Checked out',checkin:'Check in',checkout:'Check out',delete:'Delete',none:'No results'}};
function save(){localStorage.setItem('attendanceEmployees',JSON.stringify(employees))}
function statusBadge(s){return `<span class="badge ${s}">${words[ar?'ar':'en'][s]}</span>`}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=employees.filter(e=>(f==='all'||e.status===f)&&(`${e.name} ${e.id} ${e.dept}`.toLowerCase().includes(q)));$('rows').innerHTML=list.map(e=>`<tr class="border-t borderx"><td class="p-4"><div class="font-bold">${e.name}</div><div class="muted text-xs">${e.id}</div></td><td class="p-4 muted">${e.dept}</td><td class="p-4">${statusBadge(e.status)}</td><td class="p-4">${e.in||'—'}</td><td class="p-4">${e.out||'—'}</td><td class="p-4"><div class="flex flex-wrap gap-2"><button class="btn surface text-xs" onclick="toggleAttendance('${e.id}')">${e.in&&!e.out?words[ar?'ar':'en'].checkout:words[ar?'ar':'en'].checkin}</button><button class="btn surface text-xs" onclick="removeEmployee('${e.id}')">${words[ar?'ar':'en'].delete}</button></div></td></tr>`).join('');$('empty').classList.toggle('hidden',list.length>0);$('empty').textContent=words[ar?'ar':'en'].none;$('total').textContent=employees.length;$('presentCount').textContent=employees.filter(e=>e.status==='present').length;$('lateCount').textContent=employees.filter(e=>e.status==='late').length;$('absentCount').textContent=employees.filter(e=>e.status==='absent').length;refreshQr()}
function timeNow(){return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
window.toggleAttendance=id=>{const e=employees.find(x=>x.id===id);if(!e.in||e.out){e.in=timeNow();e.out='';e.status=parseInt(e.in.replace(':',''))>800?'late':'present'}else{e.out=timeNow();e.status='checkedout'}save();render()};
window.removeEmployee=id=>{if(confirm(ar?'حذف الموظف؟':'Delete employee?')){employees=employees.filter(e=>e.id!==id);save();render()}};
function openModal(id){$(id).classList.remove('hidden');$(id).classList.add('flex')}function closeModals(){document.querySelectorAll('.modal').forEach(x=>{x.classList.add('hidden');x.classList.remove('flex')})}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModals);
$('addEmployee').onclick=()=>openModal('employeeModal');$('simulateQr').onclick=()=>openModal('qrModal');$('employeeForm').onsubmit=e=>{e.preventDefault();const id=$('empId').value.trim();if(employees.some(x=>x.id===id)){alert(ar?'الرقم الوظيفي موجود':'Employee ID exists');return}employees.push({id,name:$('empName').value.trim(),dept:$('empDept').value.trim(),status:'absent',in:'',out:''});save();e.target.reset();closeModals();render()};
function refreshQr(){$('qrEmployee').innerHTML=employees.map(e=>`<option value="${e.id}">${e.name} — ${e.id}</option>`).join('')}$('confirmQr').onclick=()=>{toggleAttendance($('qrEmployee').value);closeModals()};$('search').oninput=render;$('filter').onchange=render;
$('theme').onclick=()=>{dark=!dark;document.body.classList.toggle('light',!dark);$('theme').textContent=dark?'☀️':'🌙'};
$('exportCsv').onclick=()=>{const rows=[['ID','Name','Department','Status','Check-in','Check-out'],...employees.map(e=>[e.id,e.name,e.dept,e.status,e.in,e.out])];const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='attendance.csv';a.click();URL.revokeObjectURL(a.href)};
$('lang').onclick=()=>{ar=!ar;document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';$('lang').textContent=ar?'EN':'عربي';const t=ar?['نظام الحضور والانصراف','لوحة تشغيل تجريبية — حفظ البيانات على الجهاز','+ موظف','تصدير CSV','إجمالي الموظفين','الحاضرون','المتأخرون','الغائبون','بحث','الحالة','التاريخ','تسجيل عبر QR','سجل الحضور اليومي','الموظف','القسم','الحالة','الدخول','الخروج','إجراء','إضافة موظف','الاسم','الرقم الوظيفي','القسم','حفظ','تسجيل الحضور','اختر الموظف لمحاكاة مسح رمز QR','تأكيد التسجيل']:['Attendance System','Functional demo — data is stored on this device','+ Employee','Export CSV','Total Employees','Present','Late','Absent','Search','Status','Date','Check in by QR','Daily Attendance Log','Employee','Department','Status','Check-in','Check-out','Action','Add Employee','Name','Employee ID','Department','Save','Attendance Check-in','Select an employee to simulate QR scanning','Confirm'];['title','subtitle','addEmployee','exportCsv','p1','p2','p3','p4','searchLabel','filterLabel','dateLabel','simulateQr','tableTitle','h1','h2','h3','h4','h5','h6','modalTitle','nameLabel','idLabel','deptLabel','saveEmployee','qrTitle','qrHint','confirmQr'].forEach((id,i)=>$(id).textContent=t[i]);$('search').placeholder=ar?'الاسم أو الرقم الوظيفي':'Name or employee ID';[...$('filter').options].forEach(o=>o.textContent=words[ar?'ar':'en'][o.value]);render()};
function tick(){$('now').textContent=new Date().toLocaleString(ar?'ar-KW':'en-KW',{dateStyle:'medium',timeStyle:'short'})}tick();setInterval(tick,30000);render();
</script>
</body></html>
