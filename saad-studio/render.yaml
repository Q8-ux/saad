services:
  - type: web
    name: saad-studio-beta
    runtime: node
    plan: free
    rootDir: saad-studio
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: ACCOUNTS_ENABLED
        value: false
      - key: APP_ORIGIN
        sync: false
