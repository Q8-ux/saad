services:
  - type: web
    name: ai-chess-kuwait
    repo: https://github.com/Q8-ux/saad
    branch: main
    rootDir: ai-chess-python
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

  - type: web
    name: workforce-platform-api
    repo: https://github.com/Q8-ux/saad
    branch: workforce-platform
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd workforce-platform/apps/api && npm ci --no-audit --no-fund && npx prisma generate && npm run build
    startCommand: cd workforce-platform/apps/api && npx prisma db push && npm run prisma:seed && npm run start:prod
    healthCheckPath: /docs
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workforce-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_TOKEN_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_REQUIRE_TLS
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_BRAND_NAME
        value: منصة نطاق العمل
      - key: WEB_APP_URL
        value: https://q8-ux.github.io/saad/
      - key: EMAIL_ACTIVATION_TTL_SECONDS
        value: "86400"
      - key: EMAIL_RESET_TTL_SECONDS
        value: "1800"
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: 24.11.0

  - type: web
    name: workforce-platform-web
    repo: https://github.com/Q8-ux/saad
    branch: workforce-platform
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd workforce-platform/apps/web && npm ci --no-audit --no-fund && npm run build
    startCommand: cd workforce-platform/apps/web && npm start -- -p $PORT
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://workforce-platform-api.onrender.com/api
      - key: NODE_VERSION
        value: 24.11.0

databases:
  - name: workforce-platform-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
