services:
  - type: web
    name: dufou3-legal-memo
    repo: https://github.com/Q8-ux/saad
    branch: deploy-legal-memo
    runtime: docker
    rootDir: legal-memo-platform
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: legal-memo-data
      mountPath: /var/data
      sizeGB: 5
