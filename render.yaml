services:
  - type: web
    name: workforce-platform-api
    repo: https://github.com/Q8-ux/saad
    branch: workforce-platform
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd workforce-platform/apps/api && npm install && npx prisma generate && npm run build
    startCommand: cd workforce-platform/apps/api && npx prisma db push && npm run prisma:seed && npm run start:prod
    healthCheckPath: /docs
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workforce-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: 24.11.0

  - type: web
    name: workforce-platform-web
    repo: https://github.com/Q8-ux/saad
    branch: workforce-platform
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd workforce-platform/apps/web && npm install && npm run build
    startCommand: cd workforce-platform/apps/web && npm start -- -p $PORT
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://workforce-platform-api.onrender.com/api
      - key: NODE_VERSION
        value: 24.11.0

databases:
  - name: workforce-platform-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
