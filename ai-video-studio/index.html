<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو الفيديو الذكي</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#061421;color:#eefcff;font-size:18px}header{padding:18px 22px;background:#0a2033;border-bottom:1px solid #216276;position:sticky;top:0;z-index:5}h1{margin:0;font-size:27px}.wrap{max-width:1200px;margin:auto;padding:18px}.bar,.card,.step{background:#0b2135;border:1px solid #23566d;border-radius:14px}.bar{padding:12px;margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap}.steps,.suggestions{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}.steps{margin-bottom:12px}.suggestions{padding:8px 2px 12px}.step{padding:12px;min-width:140px;text-align:center;cursor:pointer}.active{background:#087c86}.done{border-color:#b28a32}.card{padding:20px}label{display:block;margin:12px 0 6px;font-weight:bold}.field{position:relative}.field input,.field textarea{padding-left:54px}input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #397189;background:#061421;color:#fff;font-size:17px}textarea{min-height:150px}.mic{position:absolute;left:7px;top:7px;width:39px;height:39px;border-radius:50%;padding:0;margin:0;background:#183e55;font-size:20px}.mic.listening{background:#a33}.chip{flex:0 0 auto;background:#102d43;border:1px solid #2d667d;color:#bfeff1;padding:7px 11px;border-radius:999px;font-size:13px;margin:0}.chip.primary{background:#087c86}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:10px;padding:12px 16px;margin:5px;background:#0fa4aa;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.secondary{background:#1b4057}.gold{background:#9b7525}.status{color:#9edfe2}.scene,.ref{border:1px solid #32677e;border-radius:12px;padding:12px;margin:10px 0}.ref a{color:#7ee9ec;font-weight:bold;word-break:break-word}.ref small{display:block;color:#aacbd3;margin-top:5px}.refHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:12px;border:1px solid #397189;border-radius:999px;padding:4px 8px}.refsBox{max-height:480px;overflow:auto}audio{width:100%}@media(max-width:760px){.row{grid-template-columns:1fr}.wrap{padding:10px}body{font-size:17px}}</style></head><body><header><h1>استوديو الفيديو الذكي</h1><div class="status">بحث ذكي للمراجع + إدخال صوتي في الحقول</div></header><main class="wrap"><div class="bar"><span>API: <b id="apiState">…</b></span><span>OpenAI: <b id="oa">—</b></span><span>التقدم: <b id="progress">0%</b></span></div><div class="steps" id="steps"></div><section class="card"><div id="panel"></div><hr><button class="secondary" onclick="prev()">السابق</button><button onclick="save()">حفظ</button><button class="gold" onclick="approve()">اعتماد وانتقال</button><div id="msg" class="status"></div></section></main><script>const API='https://saad-ai-video-studio-api.onrender.com',names=['الفكرة والبحث','السيناريو','المراجعة','المشاهد','الصوت','المرئيات','الإخراج'];let stage=+(localStorage.avsStage||0),d={};try{d=JSON.parse(localStorage.aiVideoStudioV4||localStorage.aiVideoStudioV3||'{}')}catch{}d.approved=d.approved||[];d.referenceItems=d.referenceItems||[];const e=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');function save(){localStorage.aiVideoStudioV4=JSON.stringify(d);localStorage.avsStage=stage;msg.textContent='تم الحفظ ✓'}function f(k,v){d[k]=v;save()}function sf(i,k,v){d.scenes[i][k]=v;save()}function chips(id,items,scene=-1,key=''){return `<div class="suggestions">${items.map(x=>`<button class="chip" onclick="suggest('${id}','${encodeURIComponent(x)}',${scene},'${key}')">${x}</button>`).join('')}</div>`}function field(id,key,val,items=[],area=false,scene=-1){let c=scene<0?`f('${key}',this.value)`:`sf(${scene},'${key}',this.value)`;return `<div class="field">${area?`<textarea id="${id}" oninput="${c}">${e(val)}</textarea>`:`<input id="${id}" value="${e(val)}" oninput="${c}">`}<button class="mic" onclick="mic('${id}','${key}',${scene},this)">🎙</button></div>${chips(id,items,scene,key)}`}function suggest(id,x,scene,key){let v=decodeURIComponent(x),z=document.getElementById(id);z.value=(z.value?z.value+' ':'')+v;scene<0?f(key,z.value):sf(scene,key,z.value)}function mic(id,key,scene,b){let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return msg.textContent='الميكروفون غير مدعوم هنا';let r=new S();r.lang='ar-KW';b.classList.add('listening');r.onresult=x=>{let z=document.getElementById(id),t=x.results[0][0].transcript;z.value=(z.value?z.value+' ':'')+t;scene<0?f(key,z.value):sf(scene,key,z.value)};r.onend=()=>b.classList.remove('listening');r.start()}async function call(path,data){msg.textContent='جارٍ البحث/التنفيذ…';let r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),x=await r.json();if(!r.ok){msg.textContent='تعذر التنفيذ: '+(x.error||'خطأ');throw Error(x.error)}msg.textContent='تم ✓';return x}async function findRefs(type){if(!d.title&&!d.idea)return msg.textContent='اكتب موضوع الفيديو أولاً';try{let x=await call('/api/references',{type,topic:[d.title,d.idea].filter(Boolean).join('\n')});d.referenceItems=x.items||[];d.refs=d.referenceItems.map(x=>`${x.title}\n${x.url}`).join('\n\n');save();render()}catch{}}function addRef(i){let x=d.referenceItems[i];d.selectedRefs=d.selectedRefs||[];if(!d.selectedRefs.some(y=>y.url===x.url))d.selectedRefs.push(x);d.refs=d.selectedRefs.map(y=>`${y.title}\n${y.url}`).join('\n\n');save();render()}function addAllRefs(){d.selectedRefs=[...d.referenceItems];d.refs=d.selectedRefs.map(y=>`${y.title}\n${y.url}`).join('\n\n');save();render()}function refsUI(){let a=d.referenceItems||[];return `<div class="suggestions"><button class="chip primary" onclick="findRefs('youtube')">▶ YouTube</button><button class="chip primary" onclick="findRefs('references')">📚 مراجع ومصادر</button><button class="chip primary" onclick="findRefs('all')">✨ جميع ما سبق</button>${a.length?`<button class="chip" onclick="addAllRefs()">+ إضافة كل القائمة</button>`:''}</div><div class="refsBox">${a.map((x,i)=>`<div class="ref"><div class="refHead"><span class="tag">${e(x.type)}</span><button class="chip" onclick="addRef(${i})">+ إضافة</button></div><a href="${e(x.url)}" target="_blank" rel="noopener noreferrer">${e(x.title)}</a><small>${e(x.note)}</small><small>${e(x.url)}</small></div>`).join('')}</div>`}async function health(){try{let x=await(await fetch(API+'/health')).json();apiState.textContent=x.ok?'متصل':'غير متصل';oa.textContent=x.openai?'متصل':'غير مهيأ'}catch{apiState.textContent='غير متصل'}}function draw(){steps.innerHTML=names.map((n,i)=>`<div class="step ${i===stage?'active':''} ${d.approved.includes(i)?'done':''}" onclick="stage=${i};render()">${i+1}. ${n}</div>`).join('');progress.textContent=Math.round(d.approved.length/7*100)+'%'}function valid(){if(stage===0&&(!d.title||!d.idea))return'أدخل العنوان والفكرة';if(stage===1&&!d.script)return'أدخل السيناريو';if(stage===2&&!d.reviewApproved)return'اعتمد المراجعة';if(stage===3&&!(d.scenes||[]).length)return'أنشئ المشاهد';if(stage===4&&!d.voiceReady)return'جهز الصوت';if(stage===5&&!d.visualReady)return'اعتمد المرئيات';return''}function approve(){let x=valid();if(x)return msg.textContent=x;if(!d.approved.includes(stage))d.approved.push(stage);save();if(stage<6)stage++;render()}function prev(){if(stage)stage--;render()}async function gen(){try{let x=await call('/api/script',{title:d.title,idea:d.idea,minutes:d.minutes||5,references:d.selectedRefs||[]});d.script=x.text;save();render()}catch{}}async function review(){try{let x=await call('/api/review',{script:d.script});d.review=x.text;save();render()}catch{}}function mkScenes(){d.scenes=(d.script||'').split(/\n+|(?<=[.!؟])\s+/).map(x=>x.trim()).filter(Boolean).map(x=>({text:x,visual:'',prompt:'',duration:Math.max(3,Math.round(x.split(/\s+/).length/2.3))}));save();render()}async function makeVoice(){try{let x=await call('/api/voice',{text:d.script,voice:d.voice});d.audio='data:'+x.mime+';base64,'+x.audio_base64;d.voiceReady=true;save();render()}catch{}}async function plan(){try{d.renderPlan=await call('/api/render/plan',{scenes:d.scenes||[]});save();render()}catch{}}function download(){let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='video-project.json';a.click()}function render(){draw();let h='';if(stage===0)h=`<h2>1. الفكرة والبحث</h2><label>العنوان</label>${field('title','title',d.title,['لماذا يحدث هذا؟','القصة التي لم تُحكَ','ما الذي سيحدث لو؟'])}<label>المدة</label>${field('minutes','minutes',d.minutes||5,['3','5','8','10'])}<label>الفكرة والجمهور والهدف</label>${field('idea','idea',d.idea,['شرح مبسط','قصة مشوقة','محتوى تعليمي','سؤال يثير الفضول'],true)}<label>المراجع — دع الذكاء الاصطناعي يبحث عنها</label>${refsUI()}${field('refs','refs',d.refs,['YouTube','مواقع رسمية','أبحاث ودراسات','مقالات وتقارير','جميع ما سبق'],true)}`;if(stage===1)h=`<h2>2. السيناريو</h2><button onclick="gen()">توليد السيناريو</button>${field('script','script',d.script,['Hook أقوى','اختصر المقدمة','زد التشويق','جمل أقصر'],true)}`;if(stage===2)h=`<h2>3. المراجعة</h2><button onclick="review()">مراجعة ذكية</button>${field('review','review',d.review,['تحقق من الادعاءات','احذف التكرار','راجع الحقوق'],true)}<label><input style="width:auto" type="checkbox" ${d.reviewApproved?'checked':''} onchange="f('reviewApproved',this.checked)"> اعتماد المراجعة</label>`;if(stage===3)h=`<h2>4. المشاهد</h2><button onclick="mkScenes()">تقسيم السيناريو</button>${(d.scenes||[]).map((s,i)=>`<div class="scene"><b>مشهد ${i+1}</b>${field('st'+i,'text',s.text,['اختصر','زد الوضوح'],true,i)}<label>الوصف البصري</label>${field('sv'+i,'visual',s.visual,['لقطة واسعة','لقطة قريبة','إضاءة سينمائية'],true,i)}<label>Prompt</label>${field('sp'+i,'prompt',s.prompt,['واقعي','16:9','بدون نص'],true,i)}</div>`).join('')}`;if(stage===4)h=`<h2>5. الصوت</h2>${field('voice','voice',d.voice,['صوت عربي خليجي','هادئ','سرد قصصي'])}<button onclick="makeVoice()">توليد الصوت</button>${d.audio?`<audio controls src="${d.audio}"></audio>`:''}<label><input style="width:auto" type="checkbox" ${d.voiceReady?'checked':''} onchange="f('voiceReady',this.checked)"> الصوت جاهز</label>`;if(stage===5)h=`<h2>6. المرئيات</h2>${field('style','visualStyle',d.visualStyle,['واقعي سينمائي','ثبات الشخصيات','16:9','بدون كتابة'],true)}<label><input style="width:auto" type="checkbox" ${d.visualReady?'checked':''} onchange="f('visualReady',this.checked)"> المرئيات جاهزة</label>`;if(stage===6)h=`<h2>7. الإخراج</h2><button onclick="plan()">فحص الإخراج</button>${field('finalTitle','finalTitle',d.finalTitle||d.title,['عنوان فضولي','عنوان سؤال'])}${field('metadata','metadata',d.metadata,['ملخص','فصول','كلمات مفتاحية'],true)}<button onclick="download()">تنزيل المشروع</button>`;panel.innerHTML=h;msg.textContent=''}health();render();</script></body></html>
