<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو الفيديو الذكي</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#061421;color:#eefcff;font-size:18px}header{padding:18px 22px;background:#0a2033;border-bottom:1px solid #216276;position:sticky;top:0;z-index:5}h1{margin:0;font-size:27px}.wrap{max-width:1200px;margin:auto;padding:18px}.bar,.card,.step{background:#0b2135;border:1px solid #23566d;border-radius:14px}.bar{padding:12px;margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap}.steps{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.step{padding:12px;min-width:140px;text-align:center;cursor:pointer}.active{background:#087c86}.done{border-color:#b28a32}.card{padding:20px}label{display:block;margin:12px 0 6px;font-weight:bold}.field{position:relative;margin-bottom:4px}.field input,.field textarea{padding-left:54px}input,textarea,select{width:100%;padding:13px;border-radius:10px;border:1px solid #397189;background:#061421;color:#fff;font-size:17px}textarea{min-height:150px}.mic{position:absolute;left:7px;top:7px;width:39px;height:39px;border-radius:50%;padding:0;margin:0;background:#183e55;font-size:20px;z-index:2}.mic.listening{background:#a33;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.suggestions{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;padding:8px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.chip{flex:0 0 auto;background:#102d43;border:1px solid #2d667d;color:#bfeff1;padding:7px 11px;border-radius:999px;font-size:13px;margin:0;scroll-snap-align:start}.chip:active{background:#087c86}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:10px;padding:12px 16px;margin:5px;background:#0fa4aa;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.secondary{background:#1b4057}.gold{background:#9b7525}.status{color:#9edfe2}.bad{color:#ff9e9e}.good{color:#8ff0c8}.scene{border:1px solid #32677e;border-radius:12px;padding:12px;margin:10px 0}audio{width:100%;margin-top:10px}@media(max-width:760px){.row{grid-template-columns:1fr}.wrap{padding:10px}body{font-size:17px}.chip{font-size:13px}}</style></head><body><header><h1>استوديو الفيديو الذكي</h1><div class="status">يمكنك الكتابة أو الضغط على الميكروفون في أي خانة</div></header><main class="wrap"><div class="bar"><span>API: <b id="apiState">جارٍ الفحص…</b></span><span>OpenAI: <b id="oa">—</b></span><span>ElevenLabs: <b id="el">—</b></span><span>التقدم: <b id="progress">0%</b></span></div><div class="steps" id="steps"></div><section class="card"><div id="panel"></div><hr><button class="secondary" onclick="prev()">السابق</button><button onclick="save()">حفظ</button><button class="gold" onclick="approve()">اعتماد وانتقال</button><div id="msg" class="status"></div></section></main><script>const API='https://saad-ai-video-studio-api.onrender.com',names=['الفكرة والبحث','السيناريو','المراجعة','المشاهد','الصوت','المرئيات','الإخراج'];let stage=+(localStorage.avsStage||0),d={};try{d=JSON.parse(localStorage.aiVideoStudioV3||'{}')}catch{}d.approved=d.approved||[];const e=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');function save(){localStorage.aiVideoStudioV3=JSON.stringify(d);localStorage.avsStage=stage;msg.textContent='تم الحفظ ✓'}function f(k,v){d[k]=v;save()}function sf(i,k,v){d.scenes[i][k]=v;save()}function chips(target,items,scene=-1,key=''){return `<div class="suggestions">${items.map(x=>`<button class="chip" onclick="suggest('${target}','${encodeURIComponent(x)}',${scene},'${key}')">${x}</button>`).join('')}</div>`}function field(id,key,value,items=[],area=false,scene=-1){let change=scene<0?`f('${key}',this.value)`:`sf(${scene},'${key}',this.value)`;return `<div class="field">${area?`<textarea id="${id}" oninput="${change}">${e(value)}</textarea>`:`<input id="${id}" value="${e(value)}" oninput="${change}">`}<button class="mic" title="إملاء صوتي" onclick="mic('${id}','${key}',${scene},this)">🎙</button></div>${chips(id,items,scene,key)}`}function suggest(id,x,scene,key){let v=decodeURIComponent(x),el=document.getElementById(id);el.value=(el.value?el.value+' ':'')+v;scene<0?f(key,el.value):sf(scene,key,el.value)}function mic(id,key,scene,btn){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){msg.textContent='الإملاء الصوتي غير مدعوم في هذا المتصفح. جرّب Chrome على Android.';return}let r=new SR();r.lang='ar-KW';r.interimResults=false;r.continuous=false;btn.classList.add('listening');msg.textContent='أستمع الآن…';r.onresult=ev=>{let t=ev.results[0][0].transcript,el=document.getElementById(id);el.value=(el.value?el.value+' ':'')+t;scene<0?f(key,el.value):sf(scene,key,el.value);msg.textContent='تم إدخال الكلام ✓'};r.onerror=ev=>msg.textContent='تعذر الميكروفون: '+ev.error;r.onend=()=>btn.classList.remove('listening');r.start()}async function call(path,data){msg.textContent='جارٍ التنفيذ…';let r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),x=await r.json();if(!r.ok){msg.textContent='تعذر التنفيذ: '+(x.error||'خطأ');throw Error(x.error)}msg.textContent='تم ✓';return x}async function health(){try{let x=await(await fetch(API+'/health')).json();apiState.textContent=x.ok?'متصل':'غير متصل';oa.textContent=x.openai?'متصل':'غير مهيأ';el.textContent=x.elevenlabs?'متصل':'غير مهيأ'}catch{apiState.textContent='غير متصل'}}function draw(){steps.innerHTML=names.map((n,i)=>`<div class="step ${i===stage?'active':''} ${d.approved.includes(i)?'done':''}" onclick="stage=${i};render()">${i+1}. ${n}</div>`).join('');progress.textContent=Math.round(d.approved.length/7*100)+'%'}function valid(){if(stage===0&&(!d.title||!d.idea))return'أدخل العنوان والفكرة';if(stage===1&&!d.script)return'أدخل السيناريو';if(stage===2&&!d.reviewApproved)return'اعتمد المراجعة';if(stage===3&&!(d.scenes||[]).length)return'أنشئ المشاهد';if(stage===4&&!d.voiceReady)return'جهز الصوت';if(stage===5&&!d.visualReady)return'اعتمد المرئيات';return''}function approve(){let x=valid();if(x)return msg.textContent=x;if(!d.approved.includes(stage))d.approved.push(stage);save();if(stage<6)stage++;render()}function prev(){if(stage)stage--;render()}async function gen(){try{let x=await call('/api/script',{title:d.title,idea:d.idea,minutes:d.minutes||5});d.script=x.text;save();render()}catch{}}async function review(){try{let x=await call('/api/review',{script:d.script});d.review=x.text;save();render()}catch{}}function mkScenes(){let a=(d.script||'').split(/\n+|(?<=[.!؟])\s+/).map(x=>x.trim()).filter(Boolean);d.scenes=a.map(x=>({text:x,visual:'',prompt:'',duration:Math.max(3,Math.round(x.split(/\s+/).length/2.3))}));save();render()}async function makeVoice(){try{let x=await call('/api/voice',{text:d.script,voice:d.voice});d.audio='data:'+x.mime+';base64,'+x.audio_base64;d.voiceReady=true;save();render()}catch{}}async function plan(){try{d.renderPlan=await call('/api/render/plan',{scenes:d.scenes||[]});save();render()}catch{}}function download(){let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='video-project.json';a.click()}function render(){draw();let h='';if(stage===0)h=`<h2>1. الفكرة والبحث</h2><label>العنوان</label>${field('title','title',d.title,['لماذا يحدث هذا؟','القصة التي لم تُحكَ','ما الذي سيحدث لو؟'])}<label>المدة بالدقائق</label>${field('minutes','minutes',d.minutes||5,['3','5','8','10'])}<label>الفكرة والجمهور والهدف</label>${field('idea','idea',d.idea,['شرح مبسط للمبتدئين','قصة مشوقة','محتوى تعليمي سريع','ابدأ بسؤال يثير الفضول'],true)}<label>المراجع</label>${field('refs','refs',d.refs,['رابط YouTube','مقال موثوق','دراسة أو تقرير','مصدر رسمي'],true)}`;if(stage===1)h=`<h2>2. السيناريو</h2><button onclick="gen()">توليد السيناريو بالذكاء الاصطناعي</button><label>السيناريو</label>${field('script','script',d.script,['Hook أقوى','اختصر المقدمة','زد التشويق','اجعل الجمل أقصر','أضف خاتمة قوية'],true)}`;if(stage===2)h=`<h2>3. المراجعة</h2><button onclick="review()">مراجعة ذكية</button><label>ملاحظات التدقيق</label>${field('review','review',d.review,['تحقق من الادعاءات','احذف التكرار','راجع حقوق النشر','حسّن الوضوح','راجع الإيقاع'],true)}<label><input style="width:auto" type="checkbox" ${d.reviewApproved?'checked':''} onchange="f('reviewApproved',this.checked)"> اعتماد المراجعة</label>`;if(stage===3)h=`<h2>4. المشاهد</h2><button onclick="mkScenes()">تقسيم السيناريو</button>${(d.scenes||[]).map((s,i)=>`<div class="scene"><b>مشهد ${i+1}</b><label>النص الصوتي</label>${field('st'+i,'text',s.text,['اختصر','زد الوضوح','اجعله أكثر تشويقاً'],true,i)}<label>الوصف البصري</label>${field('sv'+i,'visual',s.visual,['لقطة واسعة','لقطة قريبة','حركة كاميرا بطيئة','إضاءة سينمائية','بدون كتابة داخل الصورة'],true,i)}<label>Prompt</label>${field('sp'+i,'prompt',s.prompt,['واقعي سينمائي','تفاصيل عالية','16:9','ثبات الشخصية','بدون نص'],true,i)}<label>المدة</label>${field('sd'+i,'duration',s.duration,['3','5','7','10'],false,i)}</div>`).join('')}`;if(stage===4)h=`<h2>5. الصوت</h2><label>Voice ID / ملاحظات الصوت</label>${field('voice','voice',d.voice,['صوت عربي خليجي','هادئ وواضح','سرد قصصي','سرعة متوسطة'])}<button onclick="makeVoice()">توليد التعليق الصوتي</button>${d.audio?`<audio controls src="${d.audio}"></audio>`:''}<label><input style="width:auto" type="checkbox" ${d.voiceReady?'checked':''} onchange="f('voiceReady',this.checked)"> الصوت جاهز</label>`;if(stage===5)h=`<h2>6. المرئيات</h2><label>دليل الأسلوب البصري</label>${field('style','visualStyle',d.visualStyle,['واقعي سينمائي','ألوان متناسقة','ثبات الشخصيات','16:9','بدون كتابة داخل الصور'],true)}<label><input style="width:auto" type="checkbox" ${d.visualReady?'checked':''} onchange="f('visualReady',this.checked)"> المرئيات جاهزة</label>`;if(stage===6)h=`<h2>7. الإخراج</h2><button onclick="plan()">فحص جاهزية الإخراج</button>${d.renderPlan?`<p>المدة ${d.renderPlan.totalSeconds||0} ثانية — المرئيات الناقصة ${d.renderPlan.missingVisuals||0}</p>`:''}<label>عنوان YouTube</label>${field('finalTitle','finalTitle',d.finalTitle||d.title,['عنوان فضولي','عنوان مباشر','عنوان سؤال','عنوان قصير'])}<label>الوصف والوسوم</label>${field('metadata','metadata',d.metadata,['ملخص من سطرين','فصول الفيديو','كلمات مفتاحية','دعوة للاشتراك'],true)}<button onclick="download()">تنزيل حزمة المشروع</button>`;panel.innerHTML=h;msg.textContent=''}health();render();</script></body></html>
