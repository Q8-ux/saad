<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو الفيديو الذكي</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#071525;color:#eef8ff}header{padding:22px;background:#0b2037;border-bottom:1px solid #1b5269;position:sticky;top:0;z-index:5}h1{margin:0;font-size:26px}.sub{color:#8edee0;margin-top:7px}.wrap{max-width:1200px;margin:auto;padding:22px}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}.step{padding:13px 8px;border:1px solid #24536b;background:#0b2037;border-radius:12px;text-align:center;cursor:pointer;font-weight:700}.step.active{background:#087d87}.card{background:#0b2037;border:1px solid #1d4962;border-radius:18px;padding:22px;margin-bottom:15px}label{display:block;margin:12px 0 6px;font-weight:bold}input,textarea,select{width:100%;padding:14px;border-radius:11px;border:1px solid #32647b;background:#071525;color:white;font-size:17px}textarea{min-height:180px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:11px;padding:13px 18px;font-size:16px;font-weight:bold;cursor:pointer;background:#12a7ad;color:white;margin:6px}.secondary{background:#183b52}.gold{background:#a67c24}.status{color:#8edee0;font-size:14px}.scene{border:1px solid #32647b;border-radius:13px;padding:14px;margin:10px 0}.hidden{display:none}@media(max-width:760px){.steps{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}h1{font-size:22px}.wrap{padding:12px}}</style></head><body><header><h1>🎬 استوديو الفيديو الذكي</h1><div class="sub">من الفكرة إلى حزمة إنتاج الفيديو — مشروع محفوظ تلقائياً على جهازك</div></header><main class="wrap"><div class="steps" id="steps"></div><section class="card"><div id="panel"></div><div style="margin-top:18px"><button class="secondary" onclick="prev()">السابق</button><button onclick="save()">حفظ</button><button class="gold" onclick="next()">اعتماد وانتقال</button></div><div class="status" id="status">جاهز</div></section></main><script>const names=['الفكرة والبحث','السيناريو','المراجعة','المشاهد','الصوت','المرئيات','الإخراج'];let stage=0;let d=JSON.parse(localStorage.getItem('aiVideoStudio')||'{}');const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');function field(k,v){d[k]=v;save(false)}function save(msg=true){localStorage.setItem('aiVideoStudio',JSON.stringify(d));if(msg){status.textContent='تم الحفظ ✓';setTimeout(()=>status.textContent='حفظ تلقائي مفعّل',1500)}}function drawSteps(){steps.innerHTML=names.map((n,i)=>`<div class="step ${i===stage?'active':''}" onclick="go(${i})">${i+1}. ${n}</div>`).join('')}function go(i){save(false);stage=i;render()}function next(){save(false);if(stage<6)stage++;render()}function prev(){save(false);if(stage>0)stage--;render()}function render(){drawSteps();let h='';if(stage===0)h=`<h2>1. الفكرة والبحث</h2><div class="row"><div><label>عنوان الفيديو</label><input value="${esc(d.title)}" oninput="field('title',this.value)"></div><div><label>المجال</label><input value="${esc(d.niche)}" oninput="field('niche',this.value)"></div></div><label>الفكرة والجمهور والهدف</label><textarea oninput="field('idea',this.value)">${esc(d.idea)}</textarea><label>كلمات مفتاحية / روابط مرجعية</label><textarea oninput="field('refs',this.value)">${esc(d.refs)}</textarea>`;if(stage===1)h=`<h2>2. كتابة السيناريو</h2><p>اكتب أو الصق السيناريو. يمكن ربط مولد ذكاء اصطناعي من الخادم لاحقاً.</p><label>Hook</label><textarea oninput="field('hook',this.value)">${esc(d.hook)}</textarea><label>السيناريو الكامل</label><textarea style="min-height:350px" oninput="field('script',this.value)">${esc(d.script)}</textarea><p>عدد الكلمات: ${(d.script||'').trim().split(/\s+/).filter(Boolean).length}</p>`;if(stage===2)h=`<h2>3. المراجعة</h2><p>راجع الوضوح، التكرار، الادعاءات التي تحتاج مصدراً وحقوق النشر.</p><textarea style="min-height:380px" oninput="field('script',this.value)">${esc(d.script)}</textarea><label>ملاحظات المراجعة</label><textarea oninput="field('review',this.value)">${esc(d.review)}</textarea>`;if(stage===3){let arr=d.scenes||[];h=`<h2>4. تقسيم المشاهد</h2><button onclick="splitScenes()">تقسيم السيناريو إلى مشاهد</button><div>${arr.map((x,i)=>`<div class="scene"><b>المشهد ${i+1}</b><textarea oninput="sceneEdit(${i},this.value)">${esc(x)}</textarea></div>`).join('')}</div>`}if(stage===4)h=`<h2>5. التعليق الصوتي</h2><p>حالة مزود TTS: <b>غير متصل</b>. لا يتم إرسال مفتاح API من المتصفح.</p><label>مزود الصوت</label><select><option>ElevenLabs (يتطلب ربط Backend)</option><option>رفع صوت يدوي</option></select><label>Voice ID</label><input value="${esc(d.voice)}" oninput="field('voice',this.value)"><label>ملف صوت يدوي</label><input type="file" accept="audio/*">`;if(stage===5)h=`<h2>6. المرئيات</h2><p>أنشئ خطة الصورة/الفيديو لكل مشهد، ثم ارفع الأصول أو اربط مزود توليد من Backend.</p><label>الأسلوب البصري الموحد</label><textarea oninput="field('visualStyle',this.value)">${esc(d.visualStyle)}</textarea><input type="file" accept="image/*,video/*" multiple>`;if(stage===6)h=`<h2>7. الإخراج</h2><p><b>${esc(d.title)||'مشروع فيديو'}</b></p><p>المشاهد: ${(d.scenes||[]).length}</p><label>عنوان YouTube النهائي</label><input value="${esc(d.finalTitle||d.title)}" oninput="field('finalTitle',this.value)"><label>الوصف وMetadata</label><textarea oninput="field('metadata',this.value)">${esc(d.metadata)}</textarea><button onclick="downloadProject()">تنزيل حزمة المشروع JSON</button><p class="status">إخراج MP4 يحتاج Renderer فعلي على Backend (FFmpeg/Remotion) ولا يتم ادعاء توليده هنا.</p>`;panel.innerHTML=h;status.textContent='حفظ تلقائي مفعّل'}function splitScenes(){let s=(d.script||'').split(/\n+|(?<=[.!؟])\s+/).map(x=>x.trim()).filter(Boolean);d.scenes=s;save();render()}function sceneEdit(i,v){d.scenes[i]=v;save(false)}function downloadProject(){save(false);let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ai-video-project.json';a.click();URL.revokeObjectURL(a.href)}render()</script></body></html>
