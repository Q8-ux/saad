<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو الفيديو الذكي</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#061421;color:#eefcff;font-size:18px}header{padding:18px 22px;background:#0a2033;border-bottom:1px solid #216276;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0;font-size:27px}.sub,.muted{color:#9edfe2}.wrap{max-width:1250px;margin:auto;padding:20px}.top{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:14px}.pill,.step,.card,.log{background:#0b2135;border:1px solid #23566d;border-radius:14px}.pill{padding:12px}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:14px 0}.step{padding:13px 7px;text-align:center;cursor:pointer;font-weight:700}.step.active{background:#087c86;border-color:#28c6c8}.step.done{border-color:#a9812d}.card{padding:22px;margin-bottom:15px}label{display:block;margin:13px 0 7px;font-weight:700}input,textarea,select{width:100%;padding:14px;border-radius:11px;border:1px solid #397189;background:#061421;color:#fff;font-size:17px}textarea{min-height:150px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:11px;padding:13px 17px;font-size:16px;font-weight:700;cursor:pointer;background:#0fa4aa;color:#fff;margin:5px}.secondary{background:#1b4057}.gold{background:#9b7525}.danger{background:#7b3040}.status{font-size:14px;color:#9edfe2}.scene,.check{border:1px solid #32677e;border-radius:13px;padding:14px;margin:10px 0}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check.ok{border-color:#2b987b}.check.warn{border-color:#a9812d}.log{padding:12px;margin-top:12px;max-height:140px;overflow:auto;font-size:14px}.offline{display:none;background:#7b3040;padding:8px 12px;text-align:center}.offline.show{display:block}@media(max-width:780px){body{font-size:17px}.steps,.top,.checks,.row{grid-template-columns:1fr}.steps{display:flex;overflow:auto}.step{min-width:145px}header{align-items:flex-start;flex-direction:column}.wrap{padding:11px}}</style></head><body><div id="offline" class="offline">لا يوجد اتصال بالشبكة — يمكنك متابعة العمل محلياً وسيتم حفظ التغييرات.</div><header><div><h1>استوديو الفيديو الذكي</h1><div class="sub">مسار إنتاج منظم من الفكرة إلى حزمة الفيديو</div></div><button class="secondary" onclick="toggleLang()" id="lang">En</button></header><main class="wrap"><div class="top"><div class="pill"><b id="projectName">مشروع فيديو جديد</b><div class="status" id="saveState">حفظ تلقائي مفعّل</div></div><div class="pill">التقدم: <b id="progress">0%</b></div><div class="pill">المرحلة: <b id="stageName">الفكرة والبحث</b></div></div><div class="steps" id="steps"></div><section class="card"><div id="panel"></div><div><button class="secondary" onclick="prev()">السابق</button><button onclick="save()">حفظ</button><button class="gold" onclick="next()">تحقق واعتماد</button></div><div id="validation" class="status"></div><div class="log"><b>سجل النشاط</b><div id="logs"></div></div></section></main><script>const AR=['الفكرة والبحث','السيناريو','المراجعة','المشاهد','الصوت','المرئيات','الإخراج'];const EN=['Idea & Research','Script','Review','Scenes','Voice','Visuals','Output'];let stage=+(localStorage.getItem('avsStage')||0),lang=localStorage.getItem('avsLang')||'ar',d={};try{d=JSON.parse(localStorage.getItem('aiVideoStudioV2')||'{}')}catch(e){d={}}d.approved=d.approved||[];d.logs=d.logs||[];const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');function log(x){d.logs.unshift(new Date().toLocaleString()+' — '+x);d.logs=d.logs.slice(0,30)}function save(msg=true){try{localStorage.setItem('aiVideoStudioV2',JSON.stringify(d));localStorage.setItem('avsStage',stage);if(msg)log('تم حفظ المشروع');saveState.textContent='تم الحفظ ✓';setTimeout(()=>saveState.textContent='حفظ تلقائي مفعّل',1200)}catch(e){saveState.textContent='تعذر الحفظ المحلي'}drawLogs()}function field(k,v){d[k]=v;if(k==='title')projectName.textContent=v||'مشروع فيديو جديد';save(false)}function sceneField(i,k,v){d.scenes[i][k]=v;save(false)}function drawSteps(){let n=lang==='ar'?AR:EN;steps.innerHTML=n.map((x,i)=>`<div class="step ${i===stage?'active':''} ${d.approved.includes(i)?'done':''}" onclick="go(${i})">${i+1}. ${x}</div>`).join('');stageName.textContent=n[stage];progress.textContent=Math.round(d.approved.length/7*100)+'%'}function drawLogs(){logs.innerHTML=(d.logs||[]).slice(0,8).map(x=>`<div>${esc(x)}</div>`).join('')||'<div class="muted">لا توجد أحداث بعد</div>'}function validate(){let errs=[];if(stage===0){if(!(d.title||'').trim())errs.push('أدخل عنواناً أولياً');if(!(d.idea||'').trim())errs.push('أدخل الفكرة والجمهور والهدف')}if(stage===1&&(!(d.script||'').trim()||(d.script||'').trim().split(/\s+/).length<20))errs.push('السيناريو قصير أو فارغ');if(stage===2&&!d.reviewApproved)errs.push('فعّل اعتماد المراجعة بعد فحص المحتوى');if(stage===3&&!(d.scenes||[]).length)errs.push('قسّم السيناريو إلى مشاهد أولاً');if(stage===4&&!d.voiceReady)errs.push('حدد أن الصوت جاهز أو ارفع/اربط مصدر الصوت');if(stage===5&&!d.visualReady)errs.push('اعتمد الخطة البصرية قبل الإخراج');return errs}function next(){let e=validate();validation.textContent=e.join(' • ');if(e.length)return;if(!d.approved.includes(stage))d.approved.push(stage);log('اعتماد المرحلة: '+AR[stage]);save(false);if(stage<6)stage++;render()}function prev(){if(stage>0)stage--;render()}function go(i){stage=i;render()}function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('avsLang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=lang==='ar'?'En':'ع';render()}function splitScenes(){let s=(d.script||'').split(/\n+|(?<=[.!؟])\s+/).map(x=>x.trim()).filter(Boolean);d.scenes=s.map((x,i)=>({text:x,visual:'',prompt:'',duration:Math.max(3,Math.round(x.split(/\s+/).length/2.3)),shot:'متوسط'}));log('تم إنشاء '+s.length+' مشهداً');save();render()}function render(){drawSteps();projectName.textContent=d.title||'مشروع فيديو جديد';let h='';if(stage===0)h=`<h2>1. الفكرة والبحث</h2><div class="row"><div><label>عنوان الفيديو *</label><input value="${esc(d.title)}" oninput="field('title',this.value)"></div><div><label>المجال</label><input value="${esc(d.niche)}" oninput="field('niche',this.value)"></div></div><label>الفكرة + الجمهور + الهدف *</label><textarea oninput="field('idea',this.value)">${esc(d.idea)}</textarea><div class="row"><div><label>الكلمة المفتاحية الرئيسية</label><input value="${esc(d.keyword)}" oninput="field('keyword',this.value)"></div><div><label>مدة الفيديو بالدقائق</label><input type="number" min="1" value="${esc(d.minutes||5)}" oninput="field('minutes',this.value)"></div></div><label>روابط ومصادر مرجعية</label><textarea oninput="field('refs',this.value)">${esc(d.refs)}</textarea><div class="checks"><div class="check ${d.title?'ok':'warn'}">العنوان الأولي</div><div class="check ${d.idea?'ok':'warn'}">الجمهور والوعد</div><div class="check ${d.keyword?'ok':'warn'}">الكلمة المفتاحية</div><div class="check ${d.refs?'ok':'warn'}">مصادر مرجعية</div></div>`;if(stage===1){let wc=(d.script||'').trim().split(/\s+/).filter(Boolean).length;h=`<h2>2. السيناريو</h2><label>Hook — أول 30 ثانية</label><textarea oninput="field('hook',this.value)">${esc(d.hook)}</textarea><label>السيناريو الكامل *</label><textarea style="min-height:360px" oninput="field('script',this.value)">${esc(d.script)}</textarea><p>عدد الكلمات: <b>${wc}</b> — زمن تقريبي: <b>${Math.ceil(wc/140)} دقيقة</b></p>`}if(stage===2)h=`<h2>3. المراجعة والتحقق</h2><div class="checks"><div class="check">هل الوعد واضح؟</div><div class="check">هل أول 30 ثانية قوية؟</div><div class="check">هل الادعاءات المهمة لها مصادر؟</div><div class="check">هل توجد صياغة قد تنتهك حقوق النشر؟</div></div><label>ملاحظات التدقيق</label><textarea oninput="field('review',this.value)">${esc(d.review)}</textarea><label><input style="width:auto" type="checkbox" ${d.reviewApproved?'checked':''} onchange="field('reviewApproved',this.checked)"> راجعت المحتوى وأعتمده للانتقال إلى المشاهد</label>`;if(stage===3){let a=d.scenes||[];h=`<h2>4. خطة المشاهد</h2><button onclick="splitScenes()">تقسيم السيناريو تلقائياً</button>${a.map((x,i)=>`<div class="scene"><b>المشهد ${i+1}</b><label>التعليق الصوتي</label><textarea oninput="sceneField(${i},'text',this.value)">${esc(x.text)}</textarea><div class="row"><div><label>الوصف البصري</label><textarea oninput="sceneField(${i},'visual',this.value)">${esc(x.visual)}</textarea></div><div><label>Prompt</label><textarea oninput="sceneField(${i},'prompt',this.value)">${esc(x.prompt)}</textarea></div></div><div class="row"><div><label>المدة/ثانية</label><input type="number" value="${x.duration}" oninput="sceneField(${i},'duration',this.value)"></div><div><label>نوع اللقطة</label><input value="${esc(x.shot)}" oninput="sceneField(${i},'shot',this.value)"></div></div></div>`).join('')}`};if(stage===4)h=`<h2>5. الصوت</h2><p>حالة التكامل: <b>غير متصل</b>. المفاتيح السرية لا تُخزن في GitHub Pages.</p><label>المزود</label><select onchange="field('tts',this.value)"><option>رفع صوت يدوي</option><option>ElevenLabs عبر Backend</option></select><label>Voice ID / ملاحظات الأداء</label><input value="${esc(d.voice)}" oninput="field('voice',this.value)"><input type="file" accept="audio/*"><label><input style="width:auto" type="checkbox" ${d.voiceReady?'checked':''} onchange="field('voiceReady',this.checked)"> الصوت جاهز ومعتمد</label>`;if(stage===5)h=`<h2>6. المرئيات</h2><label>دليل الأسلوب البصري وثبات الشخصيات</label><textarea oninput="field('visualStyle',this.value)">${esc(d.visualStyle)}</textarea><input type="file" accept="image/*,video/*" multiple><label><input style="width:auto" type="checkbox" ${d.visualReady?'checked':''} onchange="field('visualReady',this.checked)"> الخطة البصرية والأصول جاهزة</label>`;if(stage===6)h=`<h2>7. الإخراج</h2><div class="checks"><div class="check ok">المراحل المعتمدة: ${d.approved.length}/7</div><div class="check">المشاهد: ${(d.scenes||[]).length}</div></div><label>عنوان YouTube النهائي</label><input value="${esc(d.finalTitle||d.title)}" oninput="field('finalTitle',this.value)"><label>الوصف + الفصول + الوسوم</label><textarea oninput="field('metadata',this.value)">${esc(d.metadata)}</textarea><label>Brief للصورة المصغرة</label><textarea oninput="field('thumbnail',this.value)">${esc(d.thumbnail)}</textarea><button onclick="downloadProject()">تنزيل حزمة المشروع</button><p class="status">إنتاج MP4 النهائي يحتاج Renderer آمن على Backend؛ هذه الصفحة لا تعرض توليداً وهمياً.</p>`;panel.innerHTML=h;validation.textContent='';drawLogs()}function downloadProject(){save(false);let b=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),project:d},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ai-video-studio-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);log('تصدير حزمة المشروع');save(false)}window.addEventListener('online',()=>offline.classList.remove('show'));window.addEventListener('offline',()=>offline.classList.add('show'));if(!navigator.onLine)offline.classList.add('show');render()</script></body></html>
