<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو الفيديو الذكي</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#061421;color:#eefcff;font-size:18px}header{padding:18px 22px;background:#0a2033;border-bottom:1px solid #216276;position:sticky;top:0;z-index:5}h1{margin:0;font-size:27px}.wrap{max-width:1200px;margin:auto;padding:18px}.bar,.card,.step{background:#0b2135;border:1px solid #23566d;border-radius:14px}.bar{padding:12px;margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap}.steps{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.step{padding:12px;min-width:140px;text-align:center;cursor:pointer}.active{background:#087c86}.done{border-color:#b28a32}.card{padding:20px}label{display:block;margin:12px 0 6px;font-weight:bold}input,textarea,select{width:100%;padding:13px;border-radius:10px;border:1px solid #397189;background:#061421;color:#fff;font-size:17px}textarea{min-height:150px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:10px;padding:12px 16px;margin:5px;background:#0fa4aa;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.secondary{background:#1b4057}.gold{background:#9b7525}.status{color:#9edfe2}.bad{color:#ff9e9e}.good{color:#8ff0c8}.scene{border:1px solid #32677e;border-radius:12px;padding:12px;margin:10px 0}audio{width:100%;margin-top:10px}@media(max-width:760px){.row{grid-template-columns:1fr}.wrap{padding:10px}body{font-size:17px}}</style></head><body><header><h1>استوديو الفيديو الذكي</h1><div class="status">الفكرة ← السيناريو ← المراجعة ← المشاهد ← الصوت ← المرئيات ← الإخراج</div></header><main class="wrap"><div class="bar"><span>API: <b id="apiState">جارٍ الفحص…</b></span><span>OpenAI: <b id="oa">—</b></span><span>ElevenLabs: <b id="el">—</b></span><span>التقدم: <b id="progress">0%</b></span></div><div class="steps" id="steps"></div><section class="card"><div id="panel"></div><hr><button class="secondary" onclick="prev()">السابق</button><button onclick="save()">حفظ</button><button class="gold" onclick="approve()">اعتماد وانتقال</button><div id="msg" class="status"></div></section></main><script>const API='https://saad-ai-video-studio-api.onrender.com';const names=['الفكرة والبحث','السيناريو','المراجعة','المشاهد','الصوت','المرئيات','الإخراج'];let stage=+(localStorage.avsStage||0),d={};try{d=JSON.parse(localStorage.aiVideoStudioV3||'{}')}catch{}d.approved=d.approved||[];const e=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');function save(){localStorage.aiVideoStudioV3=JSON.stringify(d);localStorage.avsStage=stage;msg.textContent='تم الحفظ ✓'}function f(k,v){d[k]=v;save()}async function call(path,data){msg.textContent='جارٍ التنفيذ…';try{let r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),x=await r.json();if(!r.ok)throw Error(x.error||'request_failed');msg.textContent='تم ✓';return x}catch(err){msg.textContent='تعذر التنفيذ: '+err.message;throw err}}async function health(){try{let r=await fetch(API+'/health'),x=await r.json();apiState.textContent=x.ok?'متصل':'غير متصل';apiState.className=x.ok?'good':'bad';oa.textContent=x.openai?'متصل':'غير مهيأ';el.textContent=x.elevenlabs?'متصل':'غير مهيأ'}catch{apiState.textContent='غير متصل';apiState.className='bad';oa.textContent=el.textContent='—'}}function drawSteps(){steps.innerHTML=names.map((n,i)=>`<div class="step ${i===stage?'active':''} ${d.approved.includes(i)?'done':''}" onclick="stage=${i};render()">${i+1}. ${n}</div>`).join('');progress.textContent=Math.round(d.approved.length/7*100)+'%'}function valid(){if(stage===0&&(!d.title||!d.idea))return'أدخل العنوان والفكرة';if(stage===1&&(!d.script||d.script.split(/\s+/).length<20))return'أنشئ أو اكتب السيناريو';if(stage===2&&!d.reviewApproved)return'اعتمد المراجعة';if(stage===3&&!(d.scenes||[]).length)return'أنشئ المشاهد';if(stage===4&&!d.voiceReady)return'جهز الصوت';if(stage===5&&!d.visualReady)return'اعتمد المرئيات';return''}function approve(){let x=valid();if(x){msg.textContent=x;return}if(!d.approved.includes(stage))d.approved.push(stage);save();if(stage<6)stage++;render()}function prev(){if(stage)stage--;render()}async function generateScript(){try{let x=await call('/api/script',{title:d.title,idea:d.idea,minutes:d.minutes||5});d.script=x.text;save();render()}catch{}}async function reviewAI(){try{let x=await call('/api/review',{script:d.script});d.review=x.text;save();render()}catch{}}function scenes(){let a=(d.script||'').split(/\n+|(?<=[.!؟])\s+/).map(x=>x.trim()).filter(Boolean);d.scenes=a.map(x=>({text:x,visual:'',prompt:'',duration:Math.max(3,Math.round(x.split(/\s+/).length/2.3))}));save();render()}function sf(i,k,v){d.scenes[i][k]=v;save()}async function voice(){try{let x=await call('/api/voice',{text:d.script,voice:d.voice});d.audio='data:'+x.mime+';base64,'+x.audio_base64;d.voiceReady=true;save();render()}catch{}}async function plan(){try{let x=await call('/api/render/plan',{scenes:d.scenes||[]});d.renderPlan=x;save();render()}catch{}}function download(){let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='video-project.json';a.click()}function render(){drawSteps();let h='';if(stage===0)h=`<h2>1. الفكرة والبحث</h2><div class="row"><div><label>العنوان</label><input value="${e(d.title)}" oninput="f('title',this.value)"></div><div><label>المدة بالدقائق</label><input type="number" value="${e(d.minutes||5)}" oninput="f('minutes',this.value)"></div></div><label>الفكرة والجمهور والهدف</label><textarea oninput="f('idea',this.value)">${e(d.idea)}</textarea><label>المراجع</label><textarea oninput="f('refs',this.value)">${e(d.refs)}</textarea>`;if(stage===1)h=`<h2>2. السيناريو</h2><button onclick="generateScript()">توليد السيناريو بالذكاء الاصطناعي</button><textarea style="min-height:380px" oninput="f('script',this.value)">${e(d.script)}</textarea>`;if(stage===2)h=`<h2>3. المراجعة</h2><button onclick="reviewAI()">مراجعة ذكية</button><label>نتيجة التدقيق</label><textarea oninput="f('review',this.value)">${e(d.review)}</textarea><label><input style="width:auto" type="checkbox" ${d.reviewApproved?'checked':''} onchange="f('reviewApproved',this.checked)"> اعتماد المراجعة</label>`;if(stage===3)h=`<h2>4. المشاهد</h2><button onclick="scenes()">تقسيم السيناريو</button>${(d.scenes||[]).map((s,i)=>`<div class="scene"><b>مشهد ${i+1}</b><textarea oninput="sf(${i},'text',this.value)">${e(s.text)}</textarea><label>الوصف البصري</label><textarea oninput="sf(${i},'visual',this.value)">${e(s.visual)}</textarea><label>Prompt</label><textarea oninput="sf(${i},'prompt',this.value)">${e(s.prompt)}</textarea><label>المدة</label><input type="number" value="${s.duration}" oninput="sf(${i},'duration',this.value)"></div>`).join('')}`;if(stage===4)h=`<h2>5. الصوت</h2><label>ElevenLabs Voice ID</label><input value="${e(d.voice)}" oninput="f('voice',this.value)"><button onclick="voice()">توليد التعليق الصوتي</button>${d.audio?`<audio controls src="${d.audio}"></audio>`:''}<label><input style="width:auto" type="checkbox" ${d.voiceReady?'checked':''} onchange="f('voiceReady',this.checked)"> الصوت جاهز</label>`;if(stage===5)h=`<h2>6. المرئيات</h2><label>دليل الأسلوب</label><textarea oninput="f('visualStyle',this.value)">${e(d.visualStyle)}</textarea><p class="status">أضف الوصف وPrompt لكل مشهد. توليد الصور سيُفعّل عند توفر مزود صور في الخادم.</p><label><input style="width:auto" type="checkbox" ${d.visualReady?'checked':''} onchange="f('visualReady',this.checked)"> المرئيات جاهزة</label>`;if(stage===6)h=`<h2>7. الإخراج</h2><button onclick="plan()">فحص جاهزية الإخراج</button>${d.renderPlan?`<p>المدة: ${d.renderPlan.totalSeconds||0} ثانية — مرئيات ناقصة: ${d.renderPlan.missingVisuals||0}</p>`:''}<label>عنوان YouTube</label><input value="${e(d.finalTitle||d.title)}" oninput="f('finalTitle',this.value)"><label>الوصف والوسوم</label><textarea oninput="f('metadata',this.value)">${e(d.metadata)}</textarea><button onclick="download()">تنزيل حزمة المشروع</button>`;panel.innerHTML=h;msg.textContent=''}health();render();</script></body></html>
