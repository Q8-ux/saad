<body>
<main class="login-shell">
<section class="brand-panel">
<a href="./" class="brand"><svg class="tam-logo" viewBox="0 0 64 64" aria-label="شعار تموينات" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="altg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b6b43"/><stop offset="1" stop-color="#063d29"/></linearGradient><linearGradient id="algold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d66a"/><stop offset="1" stop-color="#c99519"/></linearGradient></defs><circle cx="32" cy="32" r="30" fill="#fff" stroke="#d9b348" stroke-width="2"/><path d="M12 17h7l4 25h25l6-18H22" fill="none" stroke="url(#altg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 25h24l-4 12H27z" fill="url(#altg)"/><circle cx="29" cy="48" r="4" fill="url(#algold)" stroke="#0b5a3a" stroke-width="2"/><circle cx="46" cy="48" r="4" fill="url(#algold)" stroke="#0b5a3a" stroke-width="2"/><path d="M47 17c5 2 7 7 5 12-5 0-9-2-11-7 1-3 3-4 6-5z" fill="#2f9b59"/><path d="M51 13c1 3 1 7-1 11M54 18l4-3M53 22l5 1M51 17l-3-4" fill="none" stroke="url(#algold)" stroke-width="2.3" stroke-linecap="round"/></svg><span><strong>تموينات</strong><small>لوحة تشغيل المطاعم</small></span></a>
<div class="brand-copy"><p class="eyebrow">لوحة الإدارة</p><h1>مركز تشغيل تموينات</h1><p>إدارة المطاعم والمستخدمين والكريدت والمديونيات والطلبات والفواتير والتواصل من مكان واحد.</p></div>
</section>
<section class="form-panel"><div class="login-card">
<p class="eyebrow">الإدارة</p><h2>تسجيل الدخول</h2>
<form id="adminLoginForm" autocomplete="on">
<label>اسم المستخدم<input id="adminUsername" name="username" value="admin" autocomplete="username" required></label>
<label>كلمة المرور<input id="adminPassword" name="password" type="password" inputmode="numeric" autocomplete="current-password" required></label>
<div id="adminLoginError" class="error" role="alert"></div>
<button class="primary-btn" type="submit">دخول لوحة الإدارة</button>
</form>
<a class="back-link" href="./">العودة إلى تموينات</a>
</div></section>
</main>
