<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3c6f"><title>دخول استلام الطلبية | تموينات</title><link rel="stylesheet" href="assets/receipt-flow.css"></head><body><div class="login"><div class="card"><div class="brand" style="color:#0b3c6f;font-size:26px;margin-bottom:8px">نظام تموينات</div><h1>دخول موظف المطعم</h1><p class="sub">سجّل الدخول للعودة إلى فاتورة الاستلام المرتبطة بالـ QR.</p><div id="error" class="error"></div><form id="form"><label>اسم المستخدم</label><input id="username" autocomplete="username" required><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button class="btn primary" type="submit">تسجيل الدخول ومتابعة الاستلام</button></div></form><div class="secure">🔒 يتم التحقق من هوية المطعم وربط المستخدم بالفاتورة قبل السماح بالتأكيد.</div></div></div><script>const API='https://tamweenat-api.onrender.com',AUTH_KEY='tamweenat_receipt_auth',USER_KEY='tamweenat_receipt_user';const q=new URLSearchParams(location.search);const ret=q.get('return')||'receipt.html';document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('error');err.classList.remove('on');try{const r=await fetch(API+'/api/auth/restaurant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const b=await r.json();if(!r.ok)throw new Error('invalid');localStorage.setItem(AUTH_KEY,b.token);localStorage.setItem(USER_KEY,JSON.stringify(b.user||{}));location.href=ret}catch{err.textContent='بيانات الدخول غير صحيحة أو الحساب غير مخوّل.';err.classList.add('on')}})</script></body></html>
