  <style>
/* WhatsApp cleanup requested: hide mid-page WhatsApp CTA, keep footer icon without phone number */
a[href*="wa.me"],a[href*="whatsapp.com"]{display:none!important}
.support-card[href*="wa.me"],.whatsapp-card,.whatsapp-cta,.order-whatsapp{display:none!important}
.footer-whatsapp .phone,.footer-whatsapp .number,.whatsapp-footer .phone,.whatsapp-footer .number{display:none!important}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const clean=()=>{
    document.querySelectorAll('a[href*="wa.me"],a[href*="whatsapp.com"]').forEach(a=>{
      const t=(a.textContent||'').trim();
      const inFooter=!!a.closest('footer,.footer,[class*="footer"]');
      if(inFooter){
        a.removeAttribute('href'); a.removeAttribute('target'); a.style.display='inline-flex';
        [...a.childNodes].forEach(n=>{if(n.nodeType===3&&/\d{6,}/.test(n.textContent||'')) n.textContent='';});
        a.querySelectorAll('small,span,p').forEach(el=>{if(/\d{6,}/.test(el.textContent||'')) el.remove();});
      }else a.remove();
    });
    document.querySelectorAll('body *').forEach(el=>{
      const t=(el.textContent||'').trim();
      if(/^(?:\+?965)?\s*50168888$/.test(t)) el.remove();
      if((/واتساب|WhatsApp|واٹس ایپ/i.test(t))&&!el.closest('footer,.footer,[class*="footer"]')&&t.length<80){
        const card=el.closest('a,button,.card,[class*="card"],[class*="support"]');
        if(card) card.remove();
      }
    });
  };
  clean(); new MutationObserver(clean).observe(document.body,{childList:true,subtree:true});
});
</script>
</head>
  <body>
    <div id="root"></div>
  <script defer src="assets/whatsapp-cleanup.js?v=20261019-2"></script><script>
(function(){
  const params=new URLSearchParams(location.search);
  const direct=params.get('direct')||'catalog';
  if(direct!=='catalog') return;
  let tries=0;
  const go=()=>{
    const btn=document.querySelector('[data-nav-id="catalog"]');
    if(btn){btn.click();window.scrollTo(0,0);return true}
    const candidates=[...document.querySelectorAll('button,a')];
    const hit=candidates.find(el=>/تصفح الكتالوج|الكتالوج|catalog/i.test((el.textContent||'').trim()));
    if(hit){hit.click();window.scrollTo(0,0);return true}
    return false;
  };
  const timer=setInterval(()=>{if(go()||++tries>40)clearInterval(timer)},250);
})();
</script><script>
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get('guest')!=='1') return;
  let attempts=0, submitted=false;
  const tryGuest=()=>{
    if(submitted) return true;
    const pass=document.querySelector('input[type="password"]');
    const inputs=[...document.querySelectorAll('input')];
    const user=inputs.find(i=>i!==pass&&(i.type==='text'||i.type==='email'||i.name?.toLowerCase().includes('user')||i.autocomplete==='username'));
    if(!user||!pass) return false;
    user.value='restaurant1';
    pass.value='123456';
    user.dispatchEvent(new Event('input',{bubbles:true}));
    user.dispatchEvent(new Event('change',{bubbles:true}));
    pass.dispatchEvent(new Event('input',{bubbles:true}));
    pass.dispatchEvent(new Event('change',{bubbles:true}));
    const form=pass.closest('form');
    const btn=form?.querySelector('button[type="submit"],button')||[...document.querySelectorAll('button')].find(b=>/دخول|login|sign in/i.test((b.textContent||'').trim()));
    if(form){
      submitted=true;
      if(form.requestSubmit) form.requestSubmit(btn||undefined); else form.submit();
      return true;
    }
    if(btn){submitted=true;btn.click();return true}
    return false;
  };
  const veil=document.createElement('div');
  veil.id='guest-entry-veil';
  veil.innerHTML='<div style="font:700 20px Tahoma,Arial;color:#0b6047">جاري الدخول إلى حساب المطعم…</div>';
  veil.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#f8f6eb;display:grid;place-items:center';
  document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(veil),{once:true});
  const timer=setInterval(()=>{
    if(tryGuest()||++attempts>60){clearInterval(timer);setTimeout(()=>veil.remove(),1200)}
  },200);
})();
</script></body>
