<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d5a43"><title>تموينات | توريد الخضروات للمطاعم</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#123c31;font-family:Tahoma,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;background:white;border-bottom:1px solid #dce7df}header strong{font-size:26px;color:#0b6047}a{text-decoration:none;color:inherit}.nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:12px;background:#0b6047;color:white;font-weight:700}.hero{text-align:center;background:linear-gradient(140deg,#e2f1e7,#fafcf9);padding:44px 18px}.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 12px}.hero p{font-size:clamp(17px,2.5vw,21px);line-height:1.8;color:#536d60}.wrap{max-width:1160px;margin:auto;padding:25px 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{min-width:0;border:1px solid #d8e5db;border-radius:16px;padding:16px;background:white}.card h3{margin:0 0 8px;font-size:21px}.card p{color:#61766a}.notice{padding:17px;border-radius:12px;background:#e8f2e9;margin-top:18px}footer{text-align:center;padding:24px;color:#60776b}@media(max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.grid{grid-template-columns:1fr}header strong{font-size:22px}.btn{padding:10px 12px}.hero{padding:32px 14px}}</style></head><body><header><strong>تموينات</strong><nav class="nav"><a class="btn" href="#catalog">تصفح المنتجات</a><a href="../tamweenat-admin/">الإدارة</a></nav></header><section class="hero"><h1>توريد الخضروات للمطاعم</h1><p>احتياجات مطعمك الأساسية بأسعار تنافسية وطرق دفع مرنة حسب الاتفاق.</p><a class="btn" href="#catalog">عرض الخضروات</a></section><main class="wrap" id="catalog"><h2>كتالوج الخضروات</h2><div id="catalog" class="grid"><div class="card">جاري تحميل المنتجات…</div></div><div class="notice">لإتمام الطلب، ادخل إلى حساب المطعم.</div></main><footer>تموينات — توريد المطاعم</footer><script>(async()=>{const box=document.getElementById('catalog');try{const r=await fetch('../tamweenat-api/catalog.json',{cache:'no-store'});if(!r.ok)throw Error('catalog_unavailable');const a=await r.json();const veg=a.filter(p=>/خض|vegetable/i.test(String(p.category||'')+' '+String(p.subCategory||'')));box.replaceChildren();if(!veg.length){box.innerHTML='<div class="card">لا توجد خضروات معتمدة للعرض حاليًا.</div>';return}for(const p of veg){const el=document.createElement('article');el.className='card';const h=document.createElement('h3');h.textContent=p.name||p.nameAr||'منتج';const unit=document.createElement('p');unit.textContent='الوحدة: '+(p.unit||'حسب الطلب');el.append(h,unit);if(p.active&&Number(p.price)>0){const price=document.createElement('strong');price.textContent=Number(p.price).toFixed(3)+' د.ك';el.append(price)}box.append(el)}}catch{box.innerHTML='<div class="card">تعذر تحميل المنتجات مؤقتًا. يمكنك الدخول إلى حساب المطعم.</div>'}})();</script></body></html>
