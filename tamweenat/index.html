<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d5a43"><title>تموينات | توريد المطاعم</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f5;color:#123c31;font-family:Tahoma,Arial,sans-serif}header{background:#fff;border-bottom:1px solid #dce7df;padding:16px max(18px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:26px;color:#0b6047}a{color:inherit;text-decoration:none}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;background:#0b6047;color:#fff;border-radius:12px;font-weight:bold}.hero{padding:44px 20px;text-align:center;background:linear-gradient(150deg,#e5f2e8,#f9fbf7)}.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 12px}.hero p{font-size:19px;line-height:1.9;color:#52685e}.wrap{max-width:1160px;margin:auto;padding:26px 16px}.heading{font-size:27px;margin:12px 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #d9e5dc;border-radius:17px;padding:18px;min-width:0}.card h3{margin:0 0 9px;font-size:22px}.card p{color:#64766b}.status{margin-top:18px;padding:14px;border-radius:12px;background:#eaf3ec}.nav{display:flex;gap:9px;flex-wrap:wrap}.empty{padding:20px;background:white;border-radius:14px}footer{text-align:center;padding:24px;color:#64766b}@media(max-width:760px){header{padding:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:35px 16px}.hero p{font-size:17px}}@media(max-width:480px){.grid{grid-template-columns:1fr}header b{font-size:22px}.btn{padding:11px 12px}}</style></head><body><header><b>تموينات</b><nav class="nav"><a class="btn" href="../zad-restaurants/login.html">دخول المطعم</a><a href="../tamweenat-admin/">الإدارة</a></nav></header><section class="hero"><h1>احتياجات مطعمك من مكان واحد</h1><p>توريد الخضروات للمطاعم بأسعار تنافسية وطرق دفع مرنة حسب الاتفاق.</p><a class="btn" href="../zad-restaurants/login.html">اطلب تموينات مطعمك</a></section><main class="wrap"><h2 class="heading">كتالوج الخضروات</h2><div id="catalog" class="grid"><div class="empty">جاري تحميل المنتجات…</div></div><div id="status" class="status">لإتمام الطلب، سجّل الدخول إلى حساب المطعم.</div></main><footer>تموينات — توريد المطاعم</footer><script>(async()=>{const box=document.getElementById('catalog');try{const r=await fetch('../tamweenat-api/catalog.json',{cache:'no-store'});if(!r.ok)throw Error('catalog');const a=await r.json();const veg=a.filter(p=>/خض|vegetable/i.test(String(p.category||'')+' '+String(p.subCategory||'')));box.textContent='';if(!veg.length){box.innerHTML='<div class="empty">سيتم عرض منتجات الخضروات عند اعتمادها.</div>';return}for(const p of veg){const el=document.createElement('article');el.className='card';const title=document.createElement('h3');title.textContent=p.name||p.nameAr||'منتج';const unit=document.createElement('p');unit.textContent='الوحدة: '+(p.unit||'حسب الطلب');el.append(title,unit);if(Number(p.price)>0&&p.active){const price=document.createElement('strong');price.textContent=Number(p.price).toFixed(3)+' د.ك';el.append(price)}box.append(el)}}catch(e){box.innerHTML='<div class="empty">الكتالوج غير متاح مؤقتًا. يمكنك الدخول إلى حساب المطعم لمتابعة الطلبات.</div>'}})();</script></body></html>
