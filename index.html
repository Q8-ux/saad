<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e7eaed">
  <meta name="description" content="قصص أشهر الاختراقات الإلكترونية في العالم مع الفيديو والمصادر الأصلية.">
  <title>أرشيف الاختراقات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./cyber-archive.css?v=2">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#top" aria-label="أرشيف الاختراقات">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 3 34 11v18L20 37 6 29V11Z"/><path d="m20 10 8 5v10l-8 5-8-5V15Z"/><circle cx="20" cy="20" r="3"/></svg></span>
        <span class="brand-copy"><strong id="siteName">أرشيف الاختراقات</strong><small>CYBER CASE ARCHIVE</small></span>
      </a>
      <nav class="nav" aria-label="التنقل"><a href="#stories" id="navStories">القصص</a><a href="#regions" id="navRegions">الأقاليم</a><a href="#sources" id="navSources">المصادر</a><a href="#methodology" id="navMethodology">المنهجية</a></nav>
      <label class="language"><span aria-hidden="true">◎</span><select id="languageSelect" aria-label="Language"></select></label>
    </div>
  </header>

  <main id="top">
    <section class="hero-wrap">
      <div class="hero shell">
        <div class="hero-copy">
          <div class="issue-line"><span class="mini-mark">⌬</span><span id="heroEyebrow">مرصد الجرائم الرقمية</span><span id="heroVersion">الإصدار 02</span></div>
          <p class="kicker" id="heroKicker">القصة خلف الشفرة</p>
          <h1><span id="heroTitle">اختراقات غيّرت العالم،</span><em id="heroAccent">نفهمها بلا حدود.</em></h1>
          <p class="hero-deck" id="heroDeck"></p>
          <div class="hero-actions"><a class="button primary" href="#stories" id="startExplore">ابدأ الاستكشاف</a><a class="button ghost" href="#methodology" id="methodologyLabel">منهجية التحقق</a></div>
          <div class="hero-stats"><div><strong id="storyCount">31</strong><span id="storyCountLabel"></span></div><div><strong>5</strong><span id="languageCountLabel"></span></div><div><strong id="sourceCount"></strong><span id="sourceCountLabel"></span></div></div>
        </div>
        <button class="featured" id="featuredCard" type="button" aria-label="فتح الملف المختار"></button>
      </div>
    </section>

    <section class="region-section shell" id="regions">
      <div class="section-heading"><div><p class="kicker" id="regionsKicker"></p><h2 id="regionsTitle"></h2></div><p id="regionsCopy"></p></div>
      <div class="region-grid" id="regionGrid"></div>
    </section>

    <section class="explorer shell" id="stories">
      <div class="section-heading"><div><p class="kicker" id="explorerKicker"></p><h2 id="explorerTitle"></h2></div><p id="explorerCopy"></p></div>
      <div class="filter-panel"><label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search"></label><div class="filter-tabs" id="categoryTabs"></div></div>
      <div class="active-region" id="activeRegion" hidden></div>
      <div class="results-line"><span id="resultsCount"></span><i></i></div>
      <div class="story-grid" id="storyGrid"></div>
      <div class="empty" id="emptyState" hidden><strong>∅</strong><h3 id="emptyTitle"></h3><p id="emptyCopy"></p><button id="clearSearch" type="button"></button></div>
    </section>

    <section class="source-section" id="sources"><div class="shell"><div class="section-heading"><div><p class="kicker" id="sourceGuide"></p><h2 id="sourceTitle"></h2></div><p id="sourceIntro"></p></div><div class="source-list" id="sourceList"></div></div></section>

    <section class="method shell" id="methodology"><div class="method-card"><div><p class="kicker" id="methodKicker"></p><h2 id="methodTitle"></h2></div><p id="methodIntro"></p><div class="grades"><span>A</span><span>B</span><span>C</span><span>D</span></div></div></section>
  </main>

  <footer><div class="shell footer-inner"><div><strong id="footerName">أرشيف الاختراقات</strong><p id="footerText"></p></div><p id="safety"></p></div><div class="shell footer-bottom"><span>© 2026</span><span id="motto"></span></div></footer>

  <dialog id="storyDialog"><button class="dialog-close" id="dialogClose" type="button" aria-label="Close">×</button><div id="dialogContent"></div></dialog>
  <script src="./cyber-data.js?v=3"></script>
  <script src="./cyber-archive.js?v=2"></script>
</body>
</html>
