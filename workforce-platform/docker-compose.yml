services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workforce}
      POSTGRES_USER: ${POSTGRES_USER:-workforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workforce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_BRAND_NAME: ${EMAIL_BRAND_NAME:-منصة نطاق العمل}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000/}
      EMAIL_TOKEN_SECRET: ${EMAIL_TOKEN_SECRET}
      EMAIL_ACTIVATION_TTL_SECONDS: ${EMAIL_ACTIVATION_TTL_SECONDS:-86400}
      EMAIL_RESET_TTL_SECONDS: ${EMAIL_RESET_TTL_SECONDS:-1800}
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
