<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#173f70"><title>تحديث للذاكرين والذاكرات</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eff6ff;color:#20446b;font:18px/1.9 system-ui,sans-serif;padding:24px;box-sizing:border-box}main{max-width:480px;padding:32px;background:white;border:1px solid #c8dcf1;border-radius:18px;text-align:center}svg{width:54px;height:54px;fill:none;stroke:#3a73ac;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}h1{font-size:25px}p,a{font-size:17px}a{display:inline-block;color:#235f9f;padding:10px}</style></head>
<body><main><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6C9 4 6 4 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/></svg><h1 id="heading">جارٍ تحديث الموقع…</h1><p id="detail">نحدّث ملفات الواجهة مع حفظ تقدم قراءتك وإعداداتك.</p><a id="continue" href="./?v=20261109-book-3">فتح الموقع المحدّث</a></main>
<script>
(async()=>{
  const version='20261109-book-3';
  const target=new URL('./',location.href);target.searchParams.set('v',version);target.hash=location.hash;
  const scope=new URL('./',location.href).href;
  document.getElementById('continue').href=target.href;
  let lang='ar';try{lang=JSON.parse(localStorage.getItem('dhikr-v1')||'{}').lang||'ar';}catch{}
  if(lang==='en'||lang==='ur'){
    const en=lang==='en';document.documentElement.lang=lang;document.documentElement.dir=en?'ltr':'rtl';
    document.getElementById('heading').textContent=en?'Updating your reading space…':'سائٹ اپ ڈیٹ ہو رہی ہے…';
    document.getElementById('detail').textContent=en?'Refreshing interface files while keeping your reading progress and preferences.':'مطالعے کی پیش رفت اور ترتیبات محفوظ رکھتے ہوئے فائلیں اپ ڈیٹ ہو رہی ہیں۔';
    document.getElementById('continue').textContent=en?'Open the updated site':'اپ ڈیٹ شدہ سائٹ کھولیں';
  }
  const repair=async()=>{
    if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(reg=>reg.scope===scope).map(reg=>reg.unregister()));}
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>key.startsWith('dhikr-')).map(key=>caches.delete(key)));}
  };
  try{await Promise.race([repair(),new Promise(resolve=>setTimeout(resolve,5000))]);}catch{}
  location.replace(target.href);
})();
</script></body></html>
