<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c5648" />
    <title>إعادة فتح الصفحة</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f0e6; color: #153f35; font-family: system-ui, sans-serif; }
      p { padding: 24px; font-size: 1.1rem; text-align: center; }
    </style>
  </head>
  <body>
    <p>جارٍ إعادة فتح الصفحة الصحيحة…</p>
    <script>
      (() => {
        const prefix = "/saad/ant-alshaer";
        const current = location.pathname + location.search + location.hash;
        if (location.pathname === prefix || location.pathname.startsWith(prefix + "/")) {
          sessionStorage.setItem("ant-alshaer-return-path", current);
          location.replace(prefix + "/");
          return;
        }
        document.querySelector("p").textContent = "الصفحة غير موجودة.";
      })();
    </script>
  </body>
</html>
