<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001f2b">
  <meta name="color-scheme" content="light">
  <meta name="description" content="مجموعة سابق القانونية — حلول قانونية متطورة وخدمات احترافية مدعومة بالتقنية.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src https://sabeq-legal-public.centrino.chatgpt.site; base-uri 'none'; form-action 'none'">
  <title>مجموعة سابق القانونية</title>
  <style>
    :root { color-scheme: light; background: #001f2b; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #001f2b; }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      font: 700 1.15rem/1.8 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    iframe {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="loading" role="status">جاري تحميل موقع مجموعة سابق القانونية…</div>
  <iframe
    id="sabeq-site"
    title="موقع مجموعة سابق القانونية"
    src="https://sabeq-legal-public.centrino.chatgpt.site/"
    allow="microphone; clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    document.getElementById('sabeq-site').addEventListener('load', function () {
      document.getElementById('loading').hidden = true;
    });
  </script>
</body>
</html>
