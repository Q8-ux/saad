name: Sabeq sync monitor
run-name: "Sabeq monitor / ${{ inputs.operation }} / ${{ inputs.correlation_id }}"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        type: choice
        options: [snapshot, test_send, resync]
        required: true
      correlation_id:
        description: SM- followed by a UUID from the monitor
        type: string
        required: true
      memo_id:
        description: Optional memo identifier for resync
        type: string
        default: ''
      test_title:
        description: Synthetic test memo title
        type: string
        default: ''
permissions:
  contents: read
  checks: write
concurrency:
  group: sabeq-monitor-${{ inputs.correlation_id }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute reviewed production contract
        run: node monitor/runner.mjs
        env:
          SABEQ_MONITOR_TOKEN: ${{ secrets.SABEQ_MONITOR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
