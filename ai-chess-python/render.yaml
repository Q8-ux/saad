services:
  - type: web
    name: ai-chess-python
    runtime: python
    plan: free
    rootDir: ai-chess-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MASAR_API_URL
        sync: false
      - key: MASAR_AI_CHESS_TOKEN
        sync: false
      - key: CHESS_ANALYSIS_ADMIN_KEY
        sync: false
