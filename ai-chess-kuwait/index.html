<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06111f" />
    <meta name="description" content="AI Chess Kuwait — العب الشطرنج بالعربية والإنجليزية والأردية" />
    <title>AI Chess Kuwait</title>
    <link rel="stylesheet" href="./embed.css" />
    <script src="./embed.js" defer></script>
  </head>
  <body>
    <iframe
      class="game-frame"
      title="AI Chess Kuwait"
      allow="clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <div class="loading-shell" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="mark" aria-hidden="true">♞</div>
        <h1>AI Chess Kuwait</h1>
        <p>نجهّز رقعة الشطرنج الذكية</p>
        <div class="spinner" aria-hidden="true"></div>
        <small>قد يستغرق التشغيل الأول بضع لحظات</small>
        <button class="retry" type="button">إعادة المحاولة</button>
      </div>
    </div>
    <noscript>يجب تفعيل JavaScript لتشغيل اللعبة.</noscript>
  </body>
</html>
